<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050807">
  <meta name="description" content="echo3d — an interactive cinematic 3D experience by Bode AI Ad Lab.">
  <title>echo3d • Bode AI Ad Lab</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://models.readyplayer.me" crossorigin>
  <style>
    :root{color-scheme:dark;--acid:#c9ff4a;--cyan:#69e8ff;--ink:#050807}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{position:relative;color:#f5f7f2}
    canvas{display:block;width:100%;height:100%;outline:none}
    .vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 45%,transparent 25%,rgba(0,0,0,.26) 72%,rgba(0,0,0,.72) 120%)}
    .topbar{position:fixed;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:26px clamp(18px,4vw,58px);pointer-events:none}
    .brand,.toplink{pointer-events:auto;color:#f5f7f2;text-decoration:none;text-transform:uppercase;letter-spacing:.16em;font-size:10px;font-weight:700}
    .brand span{color:var(--acid)}
    .toplink{border:1px solid rgba(201,255,74,.45);padding:11px 15px;border-radius:999px;transition:background .2s,color .2s}
    .toplink:hover{background:var(--acid);color:#080b05}
    .hero{position:fixed;z-index:4;left:50%;top:49%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 36px));text-align:center;pointer-events:none;transition:opacity .8s ease,transform .8s ease}
    .hero.is-hidden{opacity:0;transform:translate(-50%,-46%) scale(.98)}
    .eyebrow{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--cyan);margin-bottom:18px}
    h1{font-size:clamp(58px,11vw,126px);line-height:.82;letter-spacing:-.085em;margin:0;color:var(--acid);font-weight:850;text-shadow:0 0 38px rgba(201,255,74,.14)}
    .subtitle{font-size:clamp(12px,1.7vw,17px);letter-spacing:.035em;color:rgba(255,255,255,.83);margin:23px 0 0}
    .micro{font-size:9px;letter-spacing:.23em;text-transform:uppercase;color:rgba(255,255,255,.48);margin-top:17px}
    .bottom{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:24px clamp(18px,4vw,58px) max(22px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;gap:20px;pointer-events:none}
    .hint{font-size:9px;letter-spacing:.19em;text-transform:uppercase;color:rgba(255,255,255,.52);line-height:1.8}
    .hint strong{color:var(--acid);font-weight:650}
    .status{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);text-align:right}
    .status:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acid);margin:0 9px 1px 0;box-shadow:0 0 12px var(--acid)}
    #notice{position:fixed;z-index:8;left:50%;bottom:86px;transform:translateX(-50%);max-width:calc(100% - 36px);padding:10px 14px;border:1px solid rgba(105,232,255,.25);border-radius:8px;background:rgba(3,12,15,.8);color:rgba(255,255,255,.72);font-size:11px;text-align:center;backdrop-filter:blur(12px)}
    #notice[hidden]{display:none}
    @media(max-width:600px){.topbar{padding-top:20px}.bottom{align-items:end}.hint{max-width:220px}.status{max-width:120px;line-height:1.7}.hero{top:47%}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"}}
  </script>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/" aria-label="Bode AI Ad Lab home">BODE <span>AI</span> AD LAB</a>
    <a class="toplink" href="/" aria-label="Return to Bode AI Ad Lab">Back to studio ↗</a>
  </div>
  <main class="hero" id="hero">
    <div class="eyebrow">An immersive creative experiment</div>
    <h1>echo3d</h1>
    <p class="subtitle">Bode AI Ad Lab · cinematic 3D experience</p>
    <p class="micro">Interactive · explore · experience</p>
  </main>
  <div class="vignette"></div>
  <div class="bottom">
    <div class="hint"><strong>Drag</strong> to orbit &nbsp;·&nbsp; <strong>Scroll</strong> to zoom<br>Move through the scene</div>
    <div class="status" id="status">Initialising experience</div>
  </div>
  <div id="notice" hidden></div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
    import { gsap } from "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js";

    const statusEl=document.querySelector("#status");
    const notice=document.querySelector("#notice");
    const hero=document.querySelector("#hero");
    const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let scene,camera,renderer,controls,avatar,particles,clock,rafId,resizeObserver;
    const cleanup=()=>{if(rafId)cancelAnimationFrame(rafId);if(resizeObserver)resizeObserver.disconnect();if(controls)controls.dispose();if(renderer){renderer.dispose();renderer.domElement.remove()}};
    window.addEventListener("pagehide",cleanup,{once:true});

    function makeFallbackAvatar(){
      const group=new THREE.Group();
      const material=new THREE.MeshStandardMaterial({color:0xc9ff4a,metalness:.52,roughness:.28,emissive:0x243500,emissiveIntensity:.6});
      const dark=new THREE.MeshStandardMaterial({color:0x122027,metalness:.7,roughness:.24});
      const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.72,1.25,8,16),material);torso.position.y=1.25;group.add(torso);
      const head=new THREE.Mesh(new THREE.SphereGeometry(.55,32,24),dark);head.position.y=2.55;group.add(head);
      const halo=new THREE.Mesh(new THREE.TorusGeometry(.95,.025,8,96),new THREE.MeshBasicMaterial({color:0x69e8ff,transparent:true,opacity:.8}));halo.position.y=2.55;halo.rotation.x=Math.PI/2.8;group.add(halo);
      const ring=new THREE.Mesh(new THREE.TorusGeometry(1.35,.018,8,96),new THREE.MeshBasicMaterial({color:0xc9ff4a,transparent:true,opacity:.65}));ring.rotation.x=Math.PI/2;ring.position.y=.08;group.add(ring);
      group.userData.fallback=true;return group;
    }

    function init(){
      scene=new THREE.Scene();scene.background=new THREE.Color(0x050807);scene.fog=new THREE.FogExp2(0x050807,.009);
      camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);camera.position.set(0,7,21);
      renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:"high-performance"});
      renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);
      renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
      renderer.domElement.setAttribute("aria-label","Interactive 3D scene. Drag to orbit and scroll to zoom.");document.body.prepend(renderer.domElement);
      controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.065;controls.minDistance=6;controls.maxDistance=65;controls.maxPolarAngle=Math.PI*.48;controls.target.set(0,3,0);
      scene.add(new THREE.HemisphereLight(0x9bcfff,0x101a18,1.7));
      const key=new THREE.DirectionalLight(0xffefcf,2.4);key.position.set(12,22,14);scene.add(key);
      const rim=new THREE.PointLight(0x54dcff,95,65);rim.position.set(-9,9,-12);scene.add(rim);
      const lime=new THREE.PointLight(0xc9ff4a,65,50);lime.position.set(10,5,8);scene.add(lime);

      const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:0x0b1511,roughness:.88,metalness:.15}));ground.rotation.x=-Math.PI/2;ground.position.y=-.04;scene.add(ground);
      const grid=new THREE.GridHelper(260,90,0x1c5347,0x102a24);grid.position.y=-.025;grid.material.transparent=true;grid.material.opacity=.36;scene.add(grid);

      const panelMat=new THREE.MeshStandardMaterial({color:0x10242a,emissive:0x087f91,emissiveIntensity:1.25,metalness:.55,roughness:.32,transparent:true,opacity:.66,side:THREE.DoubleSide});
      const edgeMat=new THREE.MeshBasicMaterial({color:0x69e8ff,transparent:true,opacity:.65});
      for(let i=0;i<15;i++){
        const g=new THREE.Group();const w=4.2+(i%3)*.55,h=2.5+(i%2)*.35;
        const panel=new THREE.Mesh(new THREE.PlaneGeometry(w,h),panelMat);g.add(panel);
        const edges=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(w,h)),edgeMat);g.add(edges);
        g.position.set((i%5-2)*12,7+(i%3)*2.1,(Math.floor(i/5)-1)*13-8);g.rotation.y=(Math.random()-.5)*.42;g.rotation.x=(Math.random()-.5)*.16;g.userData.phase=i*.7;scene.add(g);
        if(!reduced)gsap.to(g.position,{y:g.position.y+1.1,duration:2.5+i%4*.5,repeat:-1,yoyo:true,ease:"sine.inOut",delay:i*.08});
      }

      const count=4200,positions=new Float32Array(count*3);
      for(let i=0;i<count;i++){positions[i*3]=(Math.random()-.5)*150;positions[i*3+1]=Math.random()*38;positions[i*3+2]=(Math.random()-.5)*150}
      const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.BufferAttribute(positions,3));
      particles=new THREE.Points(geo,new THREE.PointsMaterial({color:0x91f5d7,size:.105,transparent:true,opacity:.72,depthWrite:false}));scene.add(particles);

      avatar=makeFallbackAvatar();avatar.position.y=0;scene.add(avatar);
      const draco=new DRACOLoader();draco.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.6/");
      const loader=new GLTFLoader();loader.setDRACOLoader(draco);
      loader.load("https://models.readyplayer.me/Edward.glb",gltf=>{
        if(!scene)return;
        scene.remove(avatar);avatar=gltf.scene;avatar.scale.setScalar(1.15);avatar.position.set(0,0,0);
        avatar.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=true}});scene.add(avatar);statusEl.textContent="3D avatar online";
        draco.dispose();
      },undefined,error=>{
        console.warn("Edward.glb could not be loaded; using the built-in 3D avatar.",error);
        statusEl.textContent="Interactive scene online";
        notice.textContent="The remote avatar could not be reached. The experience is running with its built-in 3D figure.";notice.hidden=false;
        draco.dispose();
      });

      clock=new THREE.Clock();
      if(!reduced)gsap.from(camera.position,{y:25,duration:2.6,ease:"power3.out",onUpdate:()=>controls.update()});
      statusEl.textContent="Interactive scene online";
      resizeObserver=new ResizeObserver(()=>{if(!camera||!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
      resizeObserver.observe(document.body);
      renderer.domElement.addEventListener("pointerdown",()=>{hero.classList.add("is-hidden");notice.hidden=true},{once:true});
      renderer.domElement.addEventListener("wheel",()=>{hero.classList.add("is-hidden");notice.hidden=true},{passive:true,once:true});
      animate();
    }

    function animate(){
      rafId=requestAnimationFrame(animate);const t=clock.getElapsedTime();
      if(avatar){if(avatar.userData.fallback){avatar.rotation.y=reduced?-.25:Math.sin(t*.32)*.3;avatar.position.y=reduced?0:Math.sin(t*1.4)*.22}else{avatar.rotation.y+=.0025;if(!reduced)avatar.position.y=Math.sin(t*1.7)*.12}}
      if(particles&&!reduced){const p=particles.geometry.attributes.position.array;for(let i=1;i<p.length;i+=3){p[i]+=.018;if(p[i]>40)p[i]=-2}particles.geometry.attributes.position.needsUpdate=true;particles.rotation.y=Math.sin(t*.035)*.025}
      controls.update();renderer.render(scene,camera);
    }
    try{init()}catch(error){console.error(error);statusEl.textContent="3D unavailable";notice.hidden=false;notice.textContent="This browser could not start WebGL. Please try a browser with hardware acceleration enabled."}
  </script>
</body>
</html>
