let KEY='bode_outreach_v1';const seed={leads:[],subjects:['Quick idea for {{company}}','Noticed something on {{company}}','A conversion issue I spotted'],messages:[`Hi {{first_name}},\n\nI was looking through {{company}} and noticed {{observation}}\n\nI can show you exactly what I would change if useful.\n\nBode`,`Hi {{first_name}},\n\nI came across {{website}} and noticed {{observation}}\n\nWould you like me to send the short breakdown?\n\nBode`],accounts:[],campaigns:[],settings:{blockRisky:true,requirePersonalization:true,requireReview:true,dailyDraftCap:200,draftUsage:{}}};let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;function save(){localStorage.setItem(KEY,JSON.stringify(db));if(authUser&&cloudReady){clearTimeout(cloudSyncTimer);cloudSyncTimer=setTimeout(syncWorkspace,650)}}
const app=document.getElementById('root');let page='Dashboard';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function render(){if(!authUser){renderLogin();return}app.innerHTML=`<aside class="side"><div class="brand"><img src="/logo.svg" alt="" /> <div>BODE <span>OUTREACH</span></div></div><nav class="primary-nav">${[{id:'Dashboard',label:'Overview',icon:'⌂'},{id:'Leads',label:'Leads',icon:'◎'},{id:'Outreach',label:'Outreach',icon:'↗'},{id:'Workspace',label:'Workspace',icon:'⚙'}].map(x=>`<button class="${(page===x.id||(x.id==='Outreach'&&['Campaigns','Templates','Auto Scout'].includes(page))||(x.id==='Workspace'&&['Accounts','Settings'].includes(page)))?'active':''}" onclick="go('${x.id}')" aria-label="${x.label}"><span class="nav-icon" aria-hidden="true">${x.icon}</span><span class="nav-label">${x.label}</span></button>`).join('')}</nav></aside><main class="main"><div class="mobile-brand"><img src="/logo.svg" alt=""/><div class="brand-name">BODE <span>OUTREACH</span></div></div>${({Dashboard:dashboard,Leads:leads,Outreach:outreach,Workspace:workspace,Campaigns:campaigns,Templates:templates,'Auto Scout':scout,Accounts:accounts,Settings:settings}[page]||dashboard)()}</main>`}function outreach(){return header('Outreach','Plan and personalize every message')+`<div class="section card"><h2>Outreach tools</h2><p class="muted">Campaign planning, message templates, and lead discovery in one place.</p><div class="hub-grid"><button class="hub-tile" onclick="go('Campaigns')"><span class="hub-icon">▤</span><strong>Campaigns</strong><span class="muted">Organize outreach plans</span></button><button class="hub-tile" onclick="go('Templates')"><span class="hub-icon">✎</span><strong>Templates</strong><span class="muted">Personalize messages</span></button><button class="hub-tile" onclick="go('Auto Scout')"><span class="hub-icon">⌕</span><strong>Lead Scout</strong><span class="muted">Review lead opportunities</span></button></div></div>`}
function workspace(){return header('Workspace','Connected tools and preferences')+`<div class="section card"><div class="hub-grid two"><button class="hub-tile" onclick="go('Accounts')"><span class="hub-icon">✉</span><strong>Email accounts</strong><span class="muted">Manage connected Gmail accounts</span></button><button class="hub-tile" onclick="go('Settings')"><span class="hub-icon">⚙</span><strong>Preferences</strong><span class="muted">Manage safeguards and review options</span></button></div></div>`}
function go(p){page=p;render()}
function header(t,sub=''){return `<div class="top"><div class="top-left"><img class="top-logo" src="/logo.svg" alt="Bode Outreach OS"/><div class="top-title"><h1>${esc(t)}</h1>${sub?`<div class="muted">${esc(sub)}</div>`:''}</div></div><span class="pill brand-pill">BODE OUTREACH</span></div>`}
function dashboard(){let ready=db.leads.filter(x=>x.status==='ready').length;return header('Dashboard','Your outreach at a glance')+`<div class="grid"><div class="card"><div class="muted">Leads</div><div class="stat">${db.leads.length}</div></div><div class="card"><div class="muted">Ready</div><div class="stat">${ready}</div></div><div class="card"><div class="muted">Accounts</div><div class="stat">${db.accounts.length}</div></div><div class="card"><div class="muted">Campaigns</div><div class="stat">${db.campaigns.length}</div></div></div><div class="section card"><h2>Built-in safeguards</h2><div class="checks"><div class="check">✓ Duplicate leads blocked</div><div class="check">✓ Previously contacted leads skipped</div><div class="check">✓ Risky promotional patterns flagged</div><div class="check">✓ Personalization can be required before queueing</div></div></div>`}
function leads(){return header('Leads','Keep your prospects organized')+`<div class="toolbar"><button class="btn primary" onclick="openLead()">+ Add lead</button><button class="btn" onclick="document.getElementById('csvFile').click()">Import CSV</button><input id="csvFile" type="file" accept=".csv,.txt,text/csv,text/plain" style="display:none" onchange="readCSVFile(this.files[0])"><button class="btn" onclick="clearLeads()">Clear</button></div><div class="section card leads-card">${db.leads.length?`<table class="table leads-table"><thead><tr><th>Lead</th><th>Website</th><th>Observation</th><th>Status</th><th></th></tr></thead><tbody>${db.leads.map(l=>`<tr><td data-label="Lead"><b>${esc(l.name||'No name')}</b><br><span class="muted">${esc(l.email)}</span><br>${esc(l.company||'')}</td><td data-label="Website">${esc(l.website||'')}</td><td data-label="Observation">${esc(l.observation||'')}</td><td data-label="Status"><span class="status ${l.status==='blocked'?'blocked':'ready'}">${esc(l.status)}</span></td><td data-label="Actions"><button class="btn" onclick="removeLead(${l.id})">Remove</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty leads-empty"><div style="font-size:30px;margin-bottom:10px;color:var(--green)">◎</div><strong style="display:block;color:var(--text);margin-bottom:8px">Your lead list is empty</strong><p>Add one lead manually or import a CSV to start organizing your outreach.</p><button class="btn primary" onclick="openLead()">+ Add your first lead</button></div>'}</div>`}
function campaigns(){return header('Campaigns','Describe your campaign once. Gemini tailors a separate email for each lead.')+`<div class="section card"><h2>AI campaign personalizer</h2><p class="muted">Tell Gemini your goal, preferred subject style, offer, tone, and call to action. Messages are generated for review before any email is sent.</p><label for="campaignBrief">What do you want to say?</label><textarea id="campaignBrief" class="textarea" rows="6" placeholder="Example: Write a concise, respectful email to ecommerce store owners. Mention that Bode Conversion Lab helps improve product pages and checkout conversion. Subject should be curiosity-led but not clickbait. Ask if they would like a short store-specific observation. Do not invent findings or claim we already audited their store."></textarea><div class="section"><label>Choose leads to personalize (up to 25 per batch)</label><div class="toolbar"><button class="btn" onclick="selectCampaignLeads(true)">Select ready leads</button><button class="btn" onclick="selectCampaignLeads(false)">Clear selection</button><span class="muted" id="selectedLeadCount">${db.leads.filter(l=>l.status==='ready'&&!l.contacted).length} ready leads available</span></div><div id="campaignLeadPicker" class="campaign-lead-picker">${db.leads.filter(l=>l.status==='ready'&&!l.contacted).length?db.leads.filter(l=>l.status==='ready'&&!l.contacted).map(l=>`<label class="campaign-lead"><input type="checkbox" class="campaign-lead-check" value="${esc(l.id)}" checked><span><strong>${esc(l.name||l.email)}</strong><small>${esc(l.email)} · ${esc(l.company||'No company')}</small></span></label>`).join(''):'<div class="empty">Add or import leads first.</div>'}</div></div><div class="toolbar"><button class="btn primary" id="generateCampaignBtn" onclick="generateCampaignEmails()">Generate personalized emails with Gemini</button></div><div id="campaignGenerationStatus" class="section" aria-live="polite"></div><div id="campaignPreview" class="section"></div></div><div class="section card"><h2>Saved campaigns</h2>${db.campaigns.length?`<div class="campaign-saved-list">${db.campaigns.map(c=>`<div class="check"><strong>${esc(c.name)}</strong><br><span class="muted">${esc(c.subjects)} subjects · ${esc(c.messages)} messages · ${esc(c.created)}</span></div>`).join('')}</div>`:'<div class="empty">No saved campaigns yet. Generate a campaign above to begin.</div>'}</div>`}
async function generateCampaignEmails(){const instruction=document.getElementById('campaignBrief')?.value.trim();const ids=Array.from(document.querySelectorAll('.campaign-lead-check:checked')).map(x=>x.value);const status=document.getElementById('campaignGenerationStatus');const preview=document.getElementById('campaignPreview');const btn=document.getElementById('generateCampaignBtn');if(!instruction)return alert('Describe the campaign first.');if(!ids.length)return alert('Select at least one lead.');if(ids.length>25)return alert('Select no more than 25 leads per batch.');const leads=db.leads.filter(l=>ids.includes(String(l.id))&&!l.contacted);if(!leads.length)return alert('No eligible leads selected.');btn.disabled=true;status.innerHTML='<div class="check">Asking Gemini to write individual messages…</div>';preview.innerHTML='';try{const response=await fetch('/api/gemini/personalize',{method:'POST',headers:{...(await authHeaders()),'content-type':'application/json'},body:JSON.stringify({instruction,leads})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Could not personalize campaign.');window.bodeCampaignDrafts=result.emails.map(e=>({...e,lead:leads.find(l=>String(l.id)===e.id)}));status.innerHTML='<div class="check">Generated '+result.emails.length+' personalized emails. Review each message before creating drafts.</div>';preview.innerHTML=window.bodeCampaignDrafts.map((e,i)=>'<div class="card campaign-email-preview"><label>Email '+(i+1)+' · '+esc(e.lead?.email||'')+'</label><input class="input campaign-subject" data-index="'+i+'" value="'+esc(e.subject)+'" aria-label="Email subject"><textarea class="textarea campaign-body" data-index="'+i+'" rows="6" aria-label="Email message">'+esc(e.body)+'</textarea><div class="muted">Review for accuracy before creating a draft.</div></div>').join('')+'<div class="toolbar"><button class="btn primary" onclick="startCampaignDraftQueue()">Create reviewed Gmail drafts</button><button class="btn" onclick="saveGeneratedCampaign()">Save campaign plan</button><button class="btn danger" onclick="stopCampaignQueue()">Stop queue</button></div><div id="campaignQueueStatus" class="section" aria-live="polite"></div>';}catch(e){status.innerHTML='<div class="check">'+esc(e.message||'Personalization failed')+'</div>'}finally{btn.disabled=false}}
function selectCampaignLeads(checked){document.querySelectorAll('.campaign-lead-check').forEach(x=>x.checked=checked);const n=document.querySelectorAll('.campaign-lead-check:checked').length;const label=document.getElementById('selectedLeadCount');if(label)label.textContent=n+' leads selected'}
let campaignQueueState={running:false,stop:false};
function stopCampaignQueue(){campaignQueueState.stop=true;const status=document.getElementById('campaignQueueStatus');if(status)status.innerHTML='<div class="check">Stop requested. The queue will not create any more drafts.</div>'}
function waitQueueDelay(ms){return new Promise(resolve=>{const started=Date.now();const timer=setInterval(()=>{if(campaignQueueState.stop||Date.now()-started>=ms){clearInterval(timer);resolve()}},100)})}
async function startCampaignDraftQueue(){if(campaignQueueState.running)return;const emails=window.bodeCampaignDrafts||[];if(!emails.length)return alert('Generate the personalized emails first.');const connectedResponse=await fetch('/api/accounts',{headers:await authHeaders()});if(!connectedResponse.ok)return alert('Could not load connected Gmail accounts.');const accounts=await connectedResponse.json();if(!accounts.length)return alert('Connect a Gmail account in Workspace first.');const usable=accounts.filter(a=>a.enabled!==false);if(!usable.length)return alert('No enabled Gmail account is available.');db.settings.dailyDraftCap=Math.min(200,Math.max(1,Number(db.settings.dailyDraftCap)||200));db.settings.draftUsage=db.settings.draftUsage||{};const dayKey=new Date().toISOString().slice(0,10);campaignQueueState={running:true,stop:false};let done=0,failed=0,previousAccount=null;const status=document.getElementById('campaignQueueStatus');try{for(let i=0;i<emails.length;i++){if(campaignQueueState.stop)break;const item=emails[i];const lead=item.lead;if(!lead)continue;const sub=document.querySelector('.campaign-subject[data-index="'+i+'"]')?.value.trim()||item.subject;const body=document.querySelector('.campaign-body[data-index="'+i+'"]')?.value.trim()||item.body;if(!sub||!body){failed++;continue}let account=null;for(let offset=0;offset<usable.length;offset++){const candidate=usable[(i+offset)%usable.length];const usageKey=dayKey+':'+candidate.id;const used=Number(db.settings.draftUsage[usageKey])||0;if(used<db.settings.dailyDraftCap){account=candidate;break}}if(!account){if(status)status.innerHTML='<div class="check">Daily application cap reached for all connected accounts. Queue stopped.</div>';break}const usageKey=dayKey+':'+account.id;if(previousAccount&&previousAccount.id!==account.id){for(let remaining=5;remaining>0;remaining--){if(campaignQueueState.stop)break;if(status)status.innerHTML='<div class="check">Account handoff pause: '+remaining+' seconds. Press Stop to cancel.</div>';await waitQueueDelay(1000)}if(campaignQueueState.stop)break}if(status)status.innerHTML='<div class="check">Creating draft '+(i+1)+' of '+emails.length+' · '+esc(account.email)+'</div>';try{const response=await fetch('/api/gmail/draft',{method:'POST',headers:{...(await authHeaders()),'content-type':'application/json'},body:JSON.stringify({account_id:account.id,to:lead.email,subject:sub,body})});const result=await response.json();if(!response.ok){failed++;if(response.status===429||response.status===403){if(status)status.innerHTML='<div class="check">Provider restriction detected. Queue paused. '+esc(result.error||'Try again later.')+'</div>';break}if(status)status.innerHTML='<div class="check">Draft failed for '+esc(lead.email)+': '+esc(result.error||'Provider error')+'. Continuing only if provider permits.</div>';continue}done++;db.settings.draftUsage[usageKey]=(Number(db.settings.draftUsage[usageKey])||0)+1;lead.status='prepared';lead.lastPrepared=new Date().toISOString();previousAccount=account;save()}catch(e){failed++;if(status)status.innerHTML='<div class="check">Queue paused after a network error. '+esc(e.message||'')+'</div>';break}}if(status)status.innerHTML='<div class="check">Queue '+(campaignQueueState.stop?'stopped':'finished')+'. Drafts created: '+done+'. Failed or skipped: '+failed+'. No emails were sent automatically. Review drafts in Gmail before sending.</div>';if(done){const name=prompt('Name this campaign (optional):');if(name){db.campaigns.push({name,subjects:done,messages:done,created:new Date().toLocaleDateString()});save()}}}finally{campaignQueueState.running=false;campaignQueueState.stop=false}}
function saveGeneratedCampaign(){const emails=window.bodeCampaignDrafts||[];if(!emails.length)return;const name=prompt('Campaign name');if(!name)return;db.campaigns.push({name,subjects:emails.length,messages:emails.length,created:new Date().toLocaleDateString()});save();alert('Campaign plan saved.');render()}
function templates(){return header('Templates','Save subject lines and message versions')+`<div class="section card"><div class="row"><div><label>Subjects, one per line</label><textarea id="subjects" class="textarea">${esc(db.subjects.join('\n'))}</textarea></div><div><label>Message variants, separate with ---</label><textarea id="messages" class="textarea">${esc(db.messages.join('\n---\n'))}</textarea></div></div><button class="btn primary" onclick="saveTemplates()">Save templates</button><div class="section"><div class="muted">Variables: {{first_name}} {{company}} {{website}} {{observation}}</div></div></div>`}
function risk(subject,body,lead){let reasons=[];let text=(subject+' '+body).toLowerCase();if(/free money|guaranteed|act now|urgent|winner|cash|100%|buy now/.test(text))reasons.push('Promotional or urgency language');if((body.match(/https?:\/\//g)||[]).length>2)reasons.push('Too many links');if(/[A-Z]{8,}/.test(subject))reasons.push('Excessive capitalization');if(!lead.observation)reasons.push('Missing lead-specific observation');if((body.match(/!/g)||[]).length>4)reasons.push('Excessive exclamation marks');let score=Math.min(100,reasons.length*20+(lead.observation?0:15));return {score,reasons}}
function scout(){return header('Auto Scout','Prepare a personalized email for the next lead')+`<div class="grid"><div class="card"><div class="muted">Queue</div><div class="stat">${db.leads.filter(l=>l.status==='ready'&&!l.contacted).length}</div></div><div class="card"><div class="muted">Accounts</div><div class="stat">${db.accounts.length}</div></div><div class="card"><div class="muted">Risk rule</div><div class="stat">${db.settings.blockRisky?'ON':'OFF'}</div></div><div class="card"><div class="muted">Review</div><div class="stat">${db.settings.requireReview?'ON':'OFF'}</div></div></div><div class="section card"><h2>Prepare the next email</h2><p class="muted">Selects the next eligible lead, personalizes a message, checks it for common risk patterns, and prepares a draft for your review. Nothing is sent automatically.</p><div class="toolbar"><button class="btn primary" onclick="nextLead()">Prepare next email</button></div><div id="scoutResult" class="section"></div></div>`}
function accounts(){return header('Gmail Accounts','Connect Gmail to create drafts')+`<div class="section card"><p class="muted">Gmail accounts connect through Google OAuth. Passwords are never stored. The app can prepare Gmail drafts for review.</p><div class="toolbar"><button class="btn" onclick="signOut()">Sign out</button><button class="btn" onclick="connectGmail()">Connect Gmail</button><button class="btn" onclick="loadGmailAccounts()">Refresh</button></div><div id="gmailAccounts" class="section"><div class="empty">Connect Gmail, then refresh to check your accounts.</div></div></div><div class="section card"><h2>Local queue labels</h2><div class="toolbar"><input id="acct" class="input" placeholder="your@gmail.com"><button class="btn" onclick="addAccount()">Add label</button></div><div class="section"><table class="table"><tr><th>Account</th><th>Activity</th><th></th></tr>${db.accounts.map((a,i)=>`<tr><td>${esc(a.email)}</td><td>${a.used||0}</td><td><button class="btn" onclick="removeAccount(${i})">Remove</button></td></tr>`).join('')}</table></div></div>`}
function settings(){db.settings.dailyDraftCap=Number(db.settings.dailyDraftCap)||200;db.settings.draftUsage=db.settings.draftUsage||{};return header('Preferences','Set how Bode prepares your outreach')+`<div class="settings-layout"><section class="card settings-section"><div class="settings-heading"><span class="hub-icon">◷</span><div><h2>Queue limits</h2><p class="muted">A local safety cap for draft creation. This is not a Gmail sending-limit guarantee.</p></div></div><label>Maximum drafts per connected account per day</label><input class="input" type="number" min="1" max="200" value="${Math.min(200,Math.max(1,Number(db.settings.dailyDraftCap)||200))}" onchange="db.settings.dailyDraftCap=Math.min(200,Math.max(1,Number(this.value)||1));save();render()"><p class="muted">The app cap is limited to 200 drafts per account per day. Gmail and Microsoft can enforce lower limits, and creating drafts is not the same as sending messages.</p></section><section class="card settings-section"><div class="settings-heading"><span class="hub-icon">◈</span><div><h2>Message safeguards</h2><p class="muted">Reduce risky or generic outreach before you prepare an email.</p></div></div><label class="setting-row"><span><strong>Block high-risk messages</strong><small>Stop messages flagged by the built-in risk check.</small></span><input type="checkbox" ${db.settings.blockRisky?'checked':''} onchange="db.settings.blockRisky=this.checked;save();render()"></label><label class="setting-row"><span><strong>Require lead-specific personalization</strong><small>Require a saved observation for each lead.</small></span><input type="checkbox" ${db.settings.requirePersonalization?'checked':''} onchange="db.settings.requirePersonalization=this.checked;save();render()"></label></section><section class="card settings-section"><div class="settings-heading"><span class="hub-icon">✉</span><div><h2>Email review</h2><p class="muted">Keep control over every message before it leaves your account.</p></div></div><div class="setting-row"><span><strong>Manual approval</strong><small>Bode prepares drafts or opens your email app. It never automatically sends campaigns.</small></span><span class="status ready">Always on</span></div></section><section class="card settings-section"><div class="settings-heading"><span class="hub-icon">☁</span><div><h2>Workspace sync</h2><p class="muted">Your workspace sync status is managed automatically.</p></div></div><div class="setting-row"><span><strong>Cloud workspace</strong><small>Your account workspace syncs when the connection is available.</small></span><span class="status">${cloudReady?'Connected':'Checking'}</span></div></section></div>`}
function openLead(){modal(`<h2>Add lead</h2><div class="form"><input id="lEmail" class="input" placeholder="Email"><input id="lName" class="input" placeholder="First name"><input id="lCompany" class="input" placeholder="Company"><input id="lWebsite" class="input" placeholder="Website"><textarea id="lObs" class="textarea" placeholder="Personal observation"></textarea><button class="btn primary" onclick="addLead()">Save lead</button></div>`)}function addLead(){let email=lEmail.value.trim().toLowerCase();if(!email||!/^\S+@\S+\.\S+$/.test(email))return alert('Enter a valid email.');if(db.leads.some(x=>x.email===email))return alert('Duplicate lead blocked.');db.leads.push({id:Date.now(),email,name:lName.value.trim(),company:lCompany.value.trim(),website:lWebsite.value.trim(),observation:lObs.value.trim(),status:'ready',contacted:false});save();closeModal();render()}
function nextLead(){let l=db.leads.find(x=>(x.status==='ready'||x.status==='prepared')&&!x.contacted);if(!l)return document.getElementById('scoutResult').innerHTML='<div class="empty">No eligible leads.</div>';let si=Math.floor(Math.random()*db.subjects.length),mi=Math.floor(Math.random()*db.messages.length);let sub=db.subjects[si].replaceAll('{{company}}',l.company||'your store');let body=db.messages[mi].replaceAll('{{first_name}}',l.name||'there').replaceAll('{{company}}',l.company||'your store').replaceAll('{{website}}',l.website||'your website').replaceAll('{{observation}}',l.observation||'something worth improving');let r=risk(sub,body,l);let blocked=db.settings.blockRisky&&r.score>=40;document.getElementById('scoutResult').innerHTML=`<div class="risk"><b>Risk score: ${r.score}/100</b><div class="riskbar"><i style="width:${Math.max(5,r.score)}%;background:${r.score>=40?'var(--red)':'var(--green)'}"></i></div>${r.reasons.map(x=>`<div class="check">${blocked?'✕':'⚠'} ${esc(x)}</div>`).join('')}${!r.reasons.length?'<div class="check">✓ No high-risk patterns detected</div>':''}</div><div class="section card"><b>${esc(sub)}</b><pre style="white-space:pre-wrap;font:inherit;color:#cbd2d6">${esc(body)}</pre><div class="toolbar"><button class="btn ${blocked?'danger':'primary'}" ${blocked?'disabled':''} data-subject="${esc(encodeURIComponent(sub))}" data-body="${esc(encodeURIComponent(body))}" onclick="prepareMail(${l.id},decodeURIComponent(this.dataset.subject),decodeURIComponent(this.dataset.body))">${blocked?'Blocked':'Prepare email'}</button><button class="btn" onclick="markContacted(${l.id})">Mark contacted</button></div></div>`}
async function prepareMail(id,sub,body){let l=db.leads.find(x=>x.id===id);if(!l)return;if(db.settings.requirePersonalization&&!l.observation)return alert('Personalization is required. Add an observation first.');try{const accountResponse=await fetch('/api/accounts',{headers:await authHeaders()});if(accountResponse.ok){const connected=await accountResponse.json();if(connected.length){let account=connected[0];if(connected.length>1){const choice=prompt('Choose the Gmail account for this draft:\n'+connected.map((a,i)=>(i+1)+'. '+a.email).join('\n'),'1');if(choice===null)return;const index=Number(choice)-1;if(!Number.isInteger(index)||index<0||index>=connected.length)return alert('Choose a valid account number.');account=connected[index]}const response=await fetch('/api/gmail/draft',{method:'POST',headers:{...(await authHeaders()),'content-type':'application/json'},body:JSON.stringify({account_id:account.id,to:l.email,subject:sub,body})});const result=await response.json();if(!response.ok)return alert(result.error||'Could not create Gmail draft.');l.status='prepared';l.lastPrepared=new Date().toISOString();save();alert('Gmail draft created in '+result.account+'. Review it in Gmail before sending.');render();return}}}catch(error){return alert(error.message||'Could not create Gmail draft.')}l.status='prepared';l.lastPrepared=new Date().toISOString();save();window.location.href='mailto:'+encodeURIComponent(l.email)+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body)}
function markContacted(id){let l=db.leads.find(x=>x.id===id);l.contacted=true;l.status='contacted';save();render()}
function addAccount(){let e=acct.value.trim().toLowerCase();if(!/^\S+@gmail\.com$/.test(e))return alert('Use a Gmail address.');if(db.accounts.some(a=>a.email===e))return;db.accounts.push({email:e,used:0});save();render()}function removeAccount(i){db.accounts.splice(i,1);save();render()}function removeLead(id){db.leads=db.leads.filter(x=>x.id!==id);save();render()}function clearLeads(){if(confirm('Clear all leads?')){db.leads=[];save();render()}}function saveTemplates(){db.subjects=subjects.value.split('\n').map(x=>x.trim()).filter(Boolean);db.messages=messages.value.split('\n---\n').map(x=>x.trim()).filter(Boolean);save();alert('Templates saved.')}
function newCampaign(){let name=prompt('Campaign name');if(!name)return;db.campaigns.push({name,subjects:db.subjects.length,messages:db.messages.length,created:new Date().toLocaleDateString()});save();render()}function readCSVFile(file){if(!file)return;let reader=new FileReader();reader.onload=()=>importCSVText(String(reader.result||''));reader.onerror=()=>alert('Could not read this file. Try exporting it as CSV and importing again.');reader.readAsText(file)}function importCSV(){let text=prompt('Paste CSV with columns: email,name,company,website,observation');if(!text)return;importCSVText(text)}function parseCSVRows(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'&&quoted&&next==='"'){cell+='"';i++}else if(ch==='"'){quoted=!quoted}else if(ch===','&&!quoted){row.push(cell.trim());cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);row=[];cell=''}else{cell+=ch}}row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);return rows}function importCSVText(text){const rows=parseCSVRows(String(text||'').replace(/^\uFEFF/,''));if(!rows.length){alert('The file is empty.');return}const norm=v=>String(v||'').toLowerCase().trim().replace(/[\s_-]+/g,'');const known=['email','name','firstname','first','company','website','observation','notes','emailaddress'];const first=rows[0].map(norm);const hasHeader=first.some(v=>known.includes(v));const headers=hasHeader?first:['email','name','company','website','observation'];const data=hasHeader?rows.slice(1):rows;const col=(row,names,fallback)=>{let i=headers.findIndex(h=>names.includes(h));return String(row[i>=0?i:fallback]||'').trim()};let added=0,duplicates=0,invalid=0;for(const row of data){const email=col(row,['email','emailaddress'],0).toLowerCase();if(!email&&!row.some(v=>v))continue;if(!/^\S+@\S+\.\S+$/.test(email)){invalid++;continue}if(db.leads.some(x=>String(x.email||'').toLowerCase()===email)){duplicates++;continue}const name=col(row,['name','firstname','first'],1);const company=col(row,['company'],2);const website=col(row,['website'],3);const observation=col(row,['observation','notes'],4);db.leads.push({id:Date.now()+Math.random(),email,name,company,website,observation,status:'ready',contacted:false});added++}save();render();alert('CSV import complete.\nImported: '+added+'\nDuplicates skipped: '+duplicates+'\nInvalid or missing emails: '+invalid)}
async function authHeaders(){const {data:{session}}=await authClient.auth.getSession();return session?{Authorization:'Bearer '+session.access_token}:{}}async function signIn(){if(!authClient)return alert('Sign-in is still loading. Refresh and try again.');const {error}=await authClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin}});if(error)alert('Could not start sign-in: '+error.message)}async function signOut(){if(authClient)await authClient.auth.signOut()}async function unlock(){return signIn()}async function connectGmail(){try{const r=await fetch('/api/auth/google',{headers:await authHeaders()});const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not connect Gmail');window.location.href=data.url}catch(e){alert(e.message||'Could not connect Gmail')}}async function loadGmailAccounts(){let box=document.getElementById('gmailAccounts');if(!box)return;try{let r=await fetch('/api/accounts',{headers:await authHeaders()});if(r.status===401){box.innerHTML='<div class="check">Sign in again to load your Gmail accounts.</div>';return}let a=await r.json();if(!r.ok)throw new Error(a.error||'Could not load accounts');box.innerHTML=a.length?a.map(x=>'<div class="check">✓ '+esc(x.email)+' · '+(x.enabled?'Eligible':'Disabled')+'</div>').join(''):'<div class="empty">No Gmail account connected yet.</div>'}catch(e){box.innerHTML='<div class="check">'+esc(e.message||'Could not load accounts')+'</div>'}}function pickAccount(){let a=db.accounts.filter(x=>x.enabled!==false).sort((a,b)=>(a.used||0)-(b.used||0))[0];return a||null}function modal(x){let m=document.createElement('div');m.className='modal open';m.id='modal';m.innerHTML='<div class="modalbox">'+x+'<button class="btn" onclick="closeModal()">Close</button></div>';document.body.appendChild(m)}function closeModal(){document.getElementById('modal')?.remove()}function normalizeWorkspace(data){const defaults=JSON.parse(JSON.stringify(seed));return {...defaults,...(data||{}),leads:Array.isArray(data?.leads)?data.leads:defaults.leads,subjects:Array.isArray(data?.subjects)?data.subjects:defaults.subjects,messages:Array.isArray(data?.messages)?data.messages:defaults.messages,campaigns:Array.isArray(data?.campaigns)?data.campaigns:defaults.campaigns,accounts:Array.isArray(data?.accounts)?data.accounts:defaults.accounts,settings:{...defaults.settings,...(data?.settings||{})}}}async function syncWorkspace(){if(!authUser||!cloudReady)return;try{const response=await fetch('/api/workspace',{method:'PUT',headers:{...(await authHeaders()),'content-type':'application/json'},body:JSON.stringify({data:db})});if(!response.ok)throw new Error('Cloud save failed');cloudStatus='Synced'}catch{cloudStatus='Sync failed'}}async function loadCloudWorkspace(){try{const response=await fetch('/api/workspace',{headers:await authHeaders()});const result=await response.json();if(!response.ok)throw new Error(result.error||'Could not load cloud data');if(result.data){db=normalizeWorkspace(result.data);localStorage.setItem(KEY,JSON.stringify(db));cloudReady=true;cloudStatus='Synced';render()}else{const legacyKey='bode_outreach_v1';if(!localStorage.getItem(KEY)&&localStorage.getItem(legacyKey)&&confirm('Old local workspace data was found on this browser. Import it into this signed-in account? Choose Cancel if this is a shared device.')){try{db=normalizeWorkspace(JSON.parse(localStorage.getItem(legacyKey)));localStorage.setItem(KEY,JSON.stringify(db))}catch{}}cloudReady=true;cloudStatus='Saving';await syncWorkspace();render()}}catch{cloudReady=false;cloudStatus='Sync unavailable';render()}}async function applyAuthSession(session){const previousId=authUser?.id||null;authSession=session||null;authUser=session?.user||null;if(!authUser){cloudReady=false;cloudStatus='Sign in';renderLogin();return}if(authUser.id!==previousId){KEY='bode_outreach_v1_'+authUser.id;try{db=normalizeWorkspace(JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(seed)))}catch{db=normalizeWorkspace(null)}cloudReady=false;cloudStatus='Loading';app.innerHTML='<div class="auth-wrap"><section class="auth-card"><h1>Loading your workspace</h1><p>Your leads, templates, and campaigns are being synchronized.</p></section></div>';await loadCloudWorkspace()}else{render()}if(page==='Accounts')loadGmailAccounts()}function renderLogin(){app.innerHTML='<div class="auth-wrap"><section class="auth-card"><div class="brand" style="padding:0 0 18px"><img src="/logo.svg" alt="Bode Outreach OS logo" style="width:48px;height:48px" /> <div>BODE <span>OUTREACH</span></div></div><h1>Your outreach workspace</h1><p>Sign in with Google to access your own workspace and connect your Gmail account. Your connected Gmail accounts are kept separate from other users.</p><button class="btn primary" onclick="signIn()">Continue with Google</button><div class="auth-note">Bode Outreach OS helps you organize leads, personalize outreach messages, manage campaign preparation, and create Gmail drafts for your review. It does not automatically send campaigns.</div><div class="auth-note"><a href="/privacy.html" style="color:#9fe66e">Privacy Policy</a> · <a href="/terms.html" style="color:#9fe66e">Terms of Service</a></div><div class="auth-note">Gmail access is requested separately after sign-in. Read how Google data is used in our Privacy Policy.</div></section></div>'}async function initAuth(){try{const response=await fetch('/api/config');const config=await response.json();if(!response.ok)throw new Error(config.error||'Supabase configuration is missing');if(!window.supabase?.createClient)throw new Error('The sign-in library could not load. Check your connection and refresh.');authClient=window.supabase.createClient(config.supabaseUrl,config.supabaseAnonKey);const {data,error}=await authClient.auth.getSession();if(error)throw error;await applyAuthSession(data.session);authClient.auth.onAuthStateChange((_event,session)=>{applyAuthSession(session)})}catch(error){app.innerHTML='<div class="auth-wrap"><section class="auth-card"><h1>Sign-in setup needed</h1><p>'+esc(error.message||'Could not initialize sign-in')+'</p><p>Check the Supabase browser key in Vercel and the Google provider settings in Supabase Auth.</p><button class="btn" onclick="location.reload()">Try again</button></section></div>'}}if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}let authClient=null,authUser=null,authSession=null;let cloudReady=false,cloudSyncTimer=null,cloudStatus='Sign in';initAuth();
</script></body></html>
