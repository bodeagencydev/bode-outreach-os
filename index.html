function go(p){if(!allowedPages.includes(p))return;if(outreachTools.includes(p)){outreachView=p;localStorage.setItem(KEY+'_outreach_view',p);page='Outreach'}else if(p==='Workspace'){outreachView='Accounts';localStorage.setItem(KEY+'_outreach_view',outreachView);page='Outreach'}else{page=p;if(p==='Outreach')outreachView='';}localStorage.setItem(KEY+'_page',page);render();if(['Accounts','Campaigns','Dashboard'].includes(page)||['Accounts','Campaigns'].includes(outreachView))loadGmailAccounts()}

function dashboard(){let ready=db.leads.filter(x=>x.status==='ready'&&!x.contacted).length;const connected=Array.isArray(window.gmailAccountsCache)?window.gmailAccountsCache.length:'—';return header('Home','Your outreach command centre')+`<div class="grid"><div class="card"><div class="muted">All contacts</div><div class="stat">${db.leads.length}</div><button class="btn" onclick="go('Leads')">Manage leads</button></div><div class="card"><div class="muted">Ready to contact</div><div class="stat">${ready}</div><button class="btn" onclick="go('Leads')">Review contacts</button></div><div class="card"><div class="muted">Campaign plans</div><div class="stat">${db.campaigns.length}</div><button class="btn" onclick="go('Campaigns')">Open campaigns</button></div><div class="card"><div class="muted">Connected Gmail</div><div class="stat">${connected}</div><button class="btn" onclick="go('Accounts')">Manage Gmail</button></div></div><div class="section card"><h2>Start your next outreach run</h2><p class="muted">Import a contact list or scan a public website, define your message, personalize it, then manage the sending workflow from one place.</p><div class="hub-grid"><button class="hub-tile" onclick="go('Leads')"><span class="hub-icon">${iconSvg('users')}</span><strong>1. Build your lead list</strong><span class="muted">Import emails or find public contact addresses on a website.</span></button><button class="hub-tile" onclick="go('Campaigns')"><span class="hub-icon">${iconSvg('spark')}</span><strong>2. Set your message</strong><span class="muted">Personalize using your saved rules and verified lead details.</span></button><button class="hub-tile" onclick="go('Accounts')"><span class="hub-icon">${iconSvg('mail')}</span><strong>3. Connect Gmail</strong><span class="muted">Manage the real accounts authorized for your workspace.</span></button></div></div><div class="section card"><h2>Workflow overview</h2><div class="checks"><div class="check">${db.leads.length?'✓':'•'} ${db.leads.length} contacts in your workspace</div><div class="check">${ready?'✓':'•'} ${ready} contacts ready for outreach</div><div class="check">✓ Duplicate contacts are skipped during import</div><div class="check">✓ Saved writing rules are shared by the outreach tools</div></div></div>`}
function leads(){const total=db.leads.length;return header('Leads','Manage contacts and the message context for each prospect')+`<div class="toolbar"><button class="btn primary" onclick="openLead()">+ Add contact</button><button class="btn" onclick="document.getElementById('leadFile').click()">Import file</button><input id="leadFile" type="file" accept=".csv,.tsv,.txt,.json,.xlsx,.xls,.vcf" multiple style="display:none" onchange="readLeadFiles(this.files)"><button class="btn" onclick="clearLeads()">Clear list</button><span class="muted">${total} contacts</span></div><div class="section card"><h2>Find contacts from a website</h2><p class="muted">Paste a public website URL. Outreach OS will scan the page for publicly visible email addresses, then add them to your lead list. Some websites block automated requests or hide addresses, so results can vary.</p><div class="row"><input id="siteToExtract" class="input" type="url" placeholder="https://example.com"><button class="btn primary" onclick="extractWebsiteEmails()">Find website emails</button></div><div id="siteExtractStatus" class="muted section" aria-live="polite"></div></div><p class="muted">Supported files: CSV, Excel, TSV, JSON, text lists, and vCard. Email-only lists are supported.</p><div class="section card leads-card">${total?`<div class="leads-table-wrap"><table class="table leads-table"><thead><tr><th>Contact</th><th>Company / website</th><th>Message body</th><th>Status</th><th></th></tr></thead><tbody>${db.leads.map(l=>`<tr><td data-label="Contact"><b>${esc(leadDetails(l).name)}</b><br><span class="muted">${esc(l.email)}</span></td><td data-label="Company / website">${esc(leadDetails(l).company)}<br><span class="muted">${esc(leadDetails(l).website)}</span></td><td data-label="Message body">${esc(l.messageBody||l.observation||'')}</td><td data-label="Status"><span class="status ${l.status==='blocked'?'blocked':'ready'}">${esc(l.status||'ready')}</span></td><td data-label="Actions"><button class="btn" onclick="removeLead('${String(l.id).replace(/'/g,'')}')">Remove</button></td></tr>`).join('')}</tbody></table></div><div class="leads-jump-controls"><button class="btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ Go to top</button><button class="btn" onclick="window.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'})">↓ Go to end</button></div>`:'<div class="empty leads-empty"><strong style="display:block;color:var(--text);margin-bottom:8px">No contacts yet</strong><p>Add a contact or import a file to start building your lead list.</p><button class="btn primary" onclick="openLead()">+ Add your first lead</button></div>'}</div>`}function campaigns(){return header('Campaigns','Create and send personalized outreach from one place.')+`<div class="section card"><h2>Campaign builder</h2><p class="muted">Describe the message you want to send. Gemini personalizes each message using available lead details and your saved writing rules. Review or edit the generated messages if you want, then choose Send campaign to start sending from the selected Gmail account. Gmail restrictions pause the queue automatically.</p><label for="campaignBrief">What do you want to say?</label><textarea id="campaignBrief" class="textarea" rows="6" placeholder="Example: Write a short, friendly message asking a store whether it ships to the United States. Keep the original purpose and question unchanged. Personalize only the greeting or a relevant detail supported by the lead data. Do not add a purchase intention, offer, claim, or question that I did not request."></textarea><div class="section"><label>Choose contacts (up to 25 per message-generation batch. This is not a daily sending limit.)</label><label for="sendingAccount" style="display:block;margin:14px 0 6px">Send from Gmail account</label><select id="sendingAccount" class="select"><option value="">Loading connected accounts…</option></select><div class="toolbar"><button class="btn" onclick="selectCampaignLeads(true)">Select ready leads</button><button class="btn" onclick="selectCampaignLeads(false)">Clear selection</button><span class="muted" id="selectedLeadCount">${db.leads.filter(l=>l.status==='ready'&&!l.contacted).length} ready leads available</span></div><div id="campaignLeadPicker" class="campaign-lead-picker">${db.leads.filter(l=>l.status==='ready'&&!l.contacted).length?db.leads.filter(l=>l.status==='ready'&&!l.contacted).map(l=>`<label class="campaign-lead"><input type="checkbox" class="campaign-lead-check" value="${esc(l.id)}" checked><span><strong>${esc(leadDetails(l).name)}</strong><small>${esc(l.email)} · ${esc(leadDetails(l).company)}</small></span></label>`).join(''):'<div class="empty">Add or import leads first.</div>'}</div></div><div class="toolbar"><button class="btn primary" id="generateCampaignBtn" onclick="generateCampaignEmails()">Generate personalized emails with Gemini</button></div><div id="campaignGenerationStatus" class="section" aria-live="polite"></div><div id="campaignPreview" class="section"></div></div><div class="section card"><h2>Saved campaigns</h2>${db.campaigns.length?`<div class="campaign-saved-list">${db.campaigns.map(c=>`<div class="check"><strong>${esc(c.name)}</strong><br><span class="muted">${esc(c.subjects)} subjects · ${esc(c.messages)} messages · ${esc(c.created)}</span></div>`).join('')}</div>`:'<div class="empty">No saved campaigns yet. Generate a campaign above to begin.</div>'}</div>`}
async function generateCampaignEmails(){const instruction=document.getElementById('campaignBrief')?.value.trim();const ids=Array.from(document.querySelectorAll('.campaign-lead-check:checked')).map(x=>x.value);const status=document.getElementById('campaignGenerationStatus');const preview=document.getElementById('campaignPreview');const btn=document.getElementById('generateCampaignBtn');if(!instruction)return alert('Describe the campaign first.');if(!ids.length)return alert('Select at least one lead.');if(ids.length>25)return alert('Select no more than 25 leads per batch.');const leads=db.leads.filter(l=>ids.includes(String(l.id))&&!l.contacted);if(!leads.length)return alert('No eligible leads selected.');btn.disabled=true;status.innerHTML='<div class="check">Asking Gemini to write individual messages…</div>';preview.innerHTML='';try{const response=await fetch('/api/gemini/personalize',{method:'POST',headers:{...(await authHeaders()),'content-type':'application/json'},body:JSON.stringify({instruction,messageRules:db.settings.messageRules||'',leads})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Could not personalize campaign.');window.bodeCampaignDrafts=result.emails.map(e=>({...e,lead:leads.find(l=>String(l.id)===e.id)}));status.innerHTML='<div class="check">Generated '+result.emails.length+' personalized messages. You can optionally edit them below, then send the campaign after confirming.</div>';preview.innerHTML=window.bodeCampaignDrafts.map((e,i)=>'<div class="card campaign-email-preview"><label>Email '+(i+1)+' · '+esc(e.lead?.email||'')+'</label><input class="input campaign-subject" data-index="'+i+'" value="'+esc(e.subject)+'" aria-label="Email subject"><textarea class="textarea campaign-body" data-index="'+i+'" rows="6" aria-label="Email message">'+esc(e.body)+'</textarea><div class="muted">Review for accuracy before creating a draft.</div></div>').join('')+'<div class="toolbar"><button class="btn primary" onclick="startCampaignDraftQueue()">Create reviewed Gmail drafts</button><button class="btn" onclick="saveGeneratedCampaign()">Save campaign plan</button><button class="btn danger" onclick="stopCampaignQueue()">Stop queue</button></div><div id="campaignQueueStatus" class="section" aria-live="polite"></div>';}catch(e){status.innerHTML='<div class="check">'+esc(e.message||'Personalization failed')+'</div>'}finally{btn.disabled=false}}
function selectCampaignLeads(checked){document.querySelectorAll('.campaign-lead-check').forEach(x=>x.checked=checked);const n=document.querySelectorAll('.campaign-lead-check:checked').length;const label=document.getElementById('selectedLeadCount');if(label)label.textContent=n+' leads selected'}
let campaignQueueState={running:false,stop:false};
function stopCampaignQueue(){campaignQueueState.stop=true;const status=document.getElementById('campaignQueueStatus');if(status)status.innerHTML='<div class="check">Stop requested. The queue will not send any more messages after the current request.</div>'}
function waitQueueDelay(ms){return new Promise(resolve=>{const started=Date.now();const timer=setInterval(()=>{if(campaignQueueState.stop||Date.now()-started>=ms){clearInterval(timer);resolve()}},100)})}
async function startCampaignDraftQueue(){if(campaignQueueState.running)return;const emails=window.bodeCampaignDrafts||[];if(!emails.length)return alert('Generate the personalized messages first.');const picker=document.getElementById('sendingAccount');const accountId=picker?.value;if(!accountId)return alert('Choose the Gmail account that should send this campaign.');const connectedResponse=await fetch('/api/accounts',{headers:await authHeaders()});if(!connectedResponse.ok)return alert('Could not verify connected Gmail accounts.');const accounts=await connectedResponse.json();const account=accounts.find(a=>String(a.id)===String(accountId)&&a.enabled!==false);if(!account)return alert('That Gmail account is no longer available. Refresh accounts and try again.');const recipients=emails.filter(e=>e.lead&&e.lead.email&&String(e.subject||'').trim()&&String(e.body||'').trim());if(!recipients.length)return alert('There are no complete messages to send.');if(!confirm('Send '+recipients.length+' messages from '+account.email+'? This sends emails immediately and cannot be undone. The queue will stop if Gmail reports a restriction.'))return;campaignQueueState={running:true,stop:false};let sent=0,failed=0,stoppedByProvider=false;const status=document.getElementById('campaignQueueStatus');try{for(let i=0;i<emails.length;i++){if(campaignQueueState.stop)break;const item=emails[i],lead=item.lead;if(!lead||!lead.email)continue;const subject=document.querySelector('.campaign-subject[data-index="'+i+'"]')?.value.trim()||item.subject;const body=document.querySelector('.campaign-body[data-index="'+i+'"]')?.value.trim()||item.body;if(!subject||!body){failed++;continue}if(status)status.innerHTML='<div class="check">Sending '+(sent+failed+1)+' of '+recipients.length+' · '+esc(lead.email)+' · from '+esc(account.email)+'</div>';try{const response=await fetch('/api/gmail/send',{method:'POST',headers:{...(await authHeaders()),'content-type':'application/json'},body:JSON.stringify({account_id:account.id,to:lead.email,subject,body})});const result=await response.json();if(!response.ok){failed++;if(response.status===429||response.status===403){stoppedByProvider=true;if(status)status.innerHTML='<div class="check">Gmail reported a restriction. Sending has stopped. '+esc(result.error||result.providerMessage||'Try again later.')+'</div>';break}if(status)status.innerHTML='<div class="check">Send failed for '+esc(lead.email)+': '+esc(result.error||'Provider error')+'</div>';continue}sent++;lead.status='contacted';lead.contacted=true;lead.lastSent=new Date().toISOString();lead.lastSentFrom=account.email;save()}catch(e){failed++;if(status)status.innerHTML='<div class="check">Sending paused after a network error. Check the Gmail Sent folder before retrying to avoid duplicates.</div>';break}}if(status)status.innerHTML='<div class="check">Queue '+(campaignQueueState.stop?'stopped':stoppedByProvider?'paused by Gmail':failed?'finished with errors':'finished')+'. Sent: '+sent+'. Failed or skipped: '+failed+'. Sending account: '+esc(account.email)+'.</div>';if(sent){const name=prompt('Campaign name (optional):');if(name){db.campaigns.push({name,subjects:sent,messages:sent,created:new Date().toLocaleDateString(),sentFrom:account.email});save()}}}finally{campaignQueueState.running=false;campaignQueueState.stop=false}}
function saveGeneratedCampaign(){const emails=window.bodeCampaignDrafts||[];if(!emails.length)return;const name=prompt('Campaign name');if(!name)return;db.campaigns.push({name,subjects:emails.length,messages:emails.length,created:new Date().toLocaleDateString()});save();alert('Campaign plan saved.');render()}
function templates(){return header('Message templates','Create reusable subjects and message bodies')+`<div class="section card"><h2>Subject line options</h2><p class="muted">Add one subject per line. The system can choose from these when preparing a message.</p><textarea id="subjects" class="textarea" rows="4" placeholder="A quick question for {{company}}">${esc(db.subjects.join('\n'))}</textarea></div><div class="section card"><h2>Message body options</h2><p class="muted">Each message is a separate option. Put a line containing only three hyphens (---) between message versions. Keep the original purpose and use only details you actually have.</p><textarea id="messages" class="textarea" rows="10" placeholder="Hi {{first_name}},\n\nI noticed {{observation}}\n\nRegards">${esc(db.messages.join('\n---\n'))}</textarea><div class="section"><strong>Personalization fields</strong><p class="muted">{{first_name}} uses the best available contact name. {{company}} uses the business domain when identifiable. {{website}} uses the website URL. {{observation}} uses the message body saved for that lead.</p></div><button class="btn primary" onclick="saveTemplates()">Save message templates</button></div>`}
function risk(subject,body,lead){let reasons=[];let text=(subject+' '+body).toLowerCase();if(/free money|guaranteed|act now|urgent|winner|cash|100%|buy now/.test(text))reasons.push('Promotional or urgency language');if((body.match(/https?:\/\//g)||[]).length>2)reasons.push('Too many links');if(/[A-Z]{8,}/.test(subject))reasons.push('Excessive capitalization');if(!lead.observation)reasons.push('Missing lead-specific observation');if((body.match(/!/g)||[]).length>4)reasons.push('Excessive exclamation marks');let score=Math.min(100,reasons.length*20+(lead.observation?0:15));return {score,reasons}}
function scout(){return header('Quick send','Send one message from your saved templates')+`<div class="grid"><div class="card"><div class="muted">Ready contacts</div><div class="stat">${db.leads.filter(l=>l.status==='ready'&&!l.contacted).length}</div></div><div class="card"><div class="muted">Message templates</div><div class="stat">${db.messages.length}</div></div><div class="card"><div class="muted">Risk checks</div><div class="stat">${db.settings.blockRisky?'ON':'OFF'}</div></div><div class="card"><div class="muted">Personalization rule</div><div class="stat">${db.settings.requirePersonalization?'ON':'OFF'}</div></div></div><div class="section card"><h2>Send the next eligible message</h2><p class="muted">Chooses the next ready contact, fills a saved template, checks common risk patterns, and asks you to confirm before sending from a connected Gmail account. No account rotation or hidden sending happens.</p><div class="toolbar"><button class="btn primary" onclick="nextLead()">Prepare next message</button><button class="btn" onclick="go('Templates')">Edit templates</button><button class="btn" onclick="go('Accounts')">Manage Gmail</button></div><div id="scoutResult" class="section"></div></div>`}
function accounts(){return header('Connected Gmail','Manage the real Gmail accounts authorized for this workspace')+`<div class="section card"><h2>Your sending connections</h2><p class="muted">Connect Gmail through Google. This page lists actual connected accounts only. Workspace labels are not email accounts and have been removed from this screen.</p><div class="toolbar"><button class="btn primary" onclick="connectGmail()">${iconSvg('mail')} Connect Gmail</button><button class="btn" onclick="loadGmailAccounts()">Refresh accounts</button><button class="btn" onclick="signOut()">Sign out</button></div><div id="gmailAccounts" class="section"><div class="empty">Loading connected Gmail accounts…</div></div></div><div class="section card"><h2>How it works</h2><div class="checks"><div class="check">Google controls account access and authorization.</div><div class="check">Only accounts connected above can be used by the outreach workflow.</div><div class="check">Local labels are not needed and do not affect sending.</div></div></div>`}
function settings(){return header('Preferences','Configure how your outreach messages are written')+`<div class="settings-layout"><section class="card settings-section"><div class="settings-heading"><span class="hub-icon">◈</span><div><h2>Message safeguards</h2><p class="muted">Reduce risky or generic outreach before sending.</p></div></div><label class="setting-row"><span><strong>Block high-risk messages</strong><small>Stop messages flagged by the built-in risk check before sending.</small></span><input type="checkbox" ${db.settings.blockRisky?'checked':''} onchange="db.settings.blockRisky=this.checked;save();render()"></label><label class="setting-row"><span><strong>Require lead-specific personalization</strong><small>Require a saved message body for each lead.</small></span><input type="checkbox" ${db.settings.requirePersonalization?'checked':''} onchange="db.settings.requirePersonalization=this.checked;save();render()"></label></section><section class="card settings-section"><div class="settings-heading"><span class="hub-icon">✎</span><div><h2>Saved writing rules</h2><p class="muted">These rules are saved with your workspace and sent to Gemini during personalization.</p></div></div><label for="messageRules">How should messages sound and what must Gemini avoid?</label><textarea id="messageRules" class="textarea" rows="5" maxlength="3000" onchange="db.settings.messageRules=this.value.slice(0,3000);save()" onblur="db.settings.messageRules=this.value.slice(0,3000);save()">${esc(db.settings.messageRules||"Write naturally and briefly. Do not use em dashes. Do not invent facts, offers, results, prior contact, or buying intent. Preserve the exact purpose of my message.")}</textarea><p class="muted">Example: friendly wording, no pushy sales language, and use only facts present in each lead record.</p></section><section class="card settings-section"><div class="settings-heading"><span class="hub-icon">${iconSvg('mail')}</span><div><h2>Email review</h2><p class="muted">Keep control over every message before it leaves your account.</p></div></div><div class="setting-row"><span><strong>Manual approval</strong><small>Outreach OS creates drafts for review. It does not automatically send campaigns.</small></span><span class="status ready">Always on</span></div></section><section class="card settings-section"><div class="settings-heading"><span class="hub-icon">☁</span><div><h2>Workspace sync</h2><p class="muted">Your account workspace syncs when the connection is available.</p></div></div><div class="setting-row"><span><strong>Cloud workspace</strong><small>Your workspace data is scoped to your signed-in account.</small></span><span class="status">${cloudReady?'Connected':'Checking'}</span></div></section></div>`}function openLead(){modal(`<h2>Add lead</h2><div class="form"><input id="lEmail" class="input" placeholder="Email"><input id="lName" class="input" placeholder="First name"><input id="lCompany" class="input" placeholder="Company"><input id="lWebsite" class="input" placeholder="Website"><textarea id="lObs" class="textarea" placeholder="Message body (optional)"></textarea><button class="btn primary" onclick="addLead()">Save lead</button></div>`)}function addLead(){let email=lEmail.value.trim().toLowerCase();if(!email||!/^\S+@\S+\.\S+$/.test(email))return alert('Enter a valid email.');if(db.leads.some(x=>x.email===email))return alert('Duplicate lead blocked.');db.leads.push({id:Date.now(),email,name:lName.value.trim(),company:lCompany.value.trim(),website:lWebsite.value.trim(),messageBody:lObs.value.trim(),observation:lObs.value.trim(),status:'ready',contacted:false});save();closeModal();render()}
function nextLead(){let l=db.leads.find(x=>(x.status==='ready'||x.status==='prepared')&&!x.contacted);if(!l)return document.getElementById('scoutResult').innerHTML='<div class="empty">No eligible contacts remain. Add or import more leads.</div>';let si=Math.floor(Math.random()*db.subjects.length),mi=Math.floor(Math.random()*db.messages.length);const details=leadDetails(l);let sub=db.subjects[si].replaceAll('{{company}}',details.company!=='Not identified'?details.company:'your store');let body=db.messages[mi].replaceAll('{{first_name}}',details.name||'there').replaceAll('{{company}}',details.company!=='Not identified'?details.company:'your store').replaceAll('{{website}}',details.website||'your website').replaceAll('{{observation}}',l.messageBody||l.observation||'');let r=risk(sub,body,l);let blocked=db.settings.blockRisky&&r.score>=40;document.getElementById('scoutResult').innerHTML=`<div class="risk"><b>Risk score: ${r.score}/100</b><div class="riskbar"><i style="width:${Math.max(5,r.score)}%;background:${r.score>=40?'var(--red)':'var(--green)'}"></i></div>${r.reasons.map(x=>`<div class="check">${blocked?'✕':'⚠'} ${esc(x)}</div>`).join('')}${!r.reasons.length?'<div class="check">✓ No high-risk patterns detected</div>':''}</div><div class="section card"><b>${esc(sub)}</b><pre style="white-space:pre-wrap;font:inherit;color:#cbd2d6">${esc(body)}</pre><div class="toolbar"><button class="btn ${blocked?'danger':'primary'}" ${blocked?'disabled':''} data-subject="${esc(encodeURIComponent(sub))}" data-body="${esc(encodeURIComponent(body))}" onclick="prepareMail(${l.id},decodeURIComponent(this.dataset.subject),decodeURIComponent(this.dataset.body))">${blocked?'Blocked':'Send this email'}</button><button class="btn" onclick="markContacted(${l.id})">Mark contacted</button></div></div>`}
async function prepareMail(id,sub,body){const l=db.leads.find(x=>String(x.id)===String(id));if(!l)return;if(db.settings.requirePersonalization&&!String(l.messageBody||l.observation||'').trim())return alert('Personalization is required. Add a message body for this lead first.');const accountResponse=await fetch('/api/accounts',{headers:await authHeaders()});if(!accountResponse.ok)return alert('Could not load connected Gmail accounts.');const connected=(await accountResponse.json()).filter(a=>a.enabled!==false);if(!connected.length)return alert('Connect a Gmail account in Outreach first.');let account=connected[0];if(connected.length>1){const choice=prompt('Choose the Gmail account to send from:\n'+connected.map((a,i)=>(i+1)+'. '+a.email).join('\n'),'1');if(choice===null)return;const index=Number(choice)-1;if(!Number.isInteger(index)||index<0||index>=connected.length)return alert('Choose a valid account number.');account=connected[index]}if(!confirm('Send this message to '+l.email+' from '+account.email+' now?'))return;try{const response=await fetch('/api/gmail/send',{method:'POST',headers:{...(await authHeaders()),'content-type':'application/json'},body:JSON.stringify({account_id:account.id,to:l.email,subject:sub,body})});const result=await response.json();if(!response.ok)return alert(result.error||result.providerMessage||'Gmail could not send this message.');l.status='contacted';l.contacted=true;l.lastSent=new Date().toISOString();l.lastSentFrom=account.email;save();alert('Message sent to '+l.email+'.');render()}catch(error){alert(error.message||'Could not send the message. Check Gmail Sent before retrying.')}}
function markContacted(id){let l=db.leads.find(x=>x.id===id);l.contacted=true;l.status='contacted';save();render()}
function addAccount(){let e=acct.value.trim().toLowerCase();if(!/^\S+@gmail\.com$/.test(e))return alert('Use a Gmail address.');if(db.accounts.some(a=>a.email===e))return;db.accounts.push({email:e,used:0});save();render()}function removeAccount(i){const account=db.accounts[i];if(!account)return;if(!confirm("Remove this old workspace label for "+account.email+"? This will not disconnect Gmail."))return;db.accounts.splice(i,1);save();render()}function removeLead(id){const lead=db.leads.find(x=>String(x.id)===String(id));if(!lead)return;if(!confirm("Remove "+(lead.name||lead.email||"this contact")+" from your leads? This cannot be undone."))return;db.leads=db.leads.filter(x=>String(x.id)!==String(id));save();render()}function clearLeads(){if(confirm('Clear all leads?')){db.leads=[];save();render()}}function saveTemplates(){db.subjects=subjects.value.split('\n').map(x=>x.trim()).filter(Boolean);db.messages=messages.value.split('\n---\n').map(x=>x.trim()).filter(Boolean);save();alert('Templates saved.')}
function newCampaign(){let name=prompt('Campaign name');if(!name)return;db.campaigns.push({name,subjects:db.subjects.length,messages:db.messages.length,created:new Date().toLocaleDateString()});save();render()}async function readLeadFiles(files){if(!files||!files.length)return;let added=0,duplicates=0,invalid=0;const failed=[];for(const file of Array.from(files)){try{const ext=(file.name.split('.').pop()||'').toLowerCase();let rows=[];if(ext==='xlsx'||ext==='xls'){if(!window.XLSX)throw Error('Excel reader did not load. Refresh and try again.');const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});if(!wb.SheetNames.length)throw Error('No worksheet found.');rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});}else if(ext==='json'){const json=JSON.parse(await file.text());const arr=Array.isArray(json)?json:(json.leads||json.contacts);if(!Array.isArray(arr))throw Error('JSON must contain an array of contacts.');if(arr.length&&typeof arr[0]==='object'&&!Array.isArray(arr[0])){rows=[Object.keys(arr[0])];for(const obj of arr)rows.push(rows[0].map(k=>obj[k]??''));}else rows=arr;}else if(ext==='vcf'){const raw=await file.text();rows=[['email','name','company','website','messageBody']];for(const card of raw.split(/BEGIN:VCARD/i).slice(1)){const get=k=>((card.match(new RegExp('^'+k+'[^:]*:(.*)$','im'))||[])[1]||'').trim();const emails=Array.from(card.matchAll(/^EMAIL[^:]*:(.+)$/gim));for(const e of emails)rows.push([e[1].trim(),get('FN'),get('ORG'),get('URL'),'']);}}else{const raw=await file.text();if(ext==='tsv')rows=raw.split(/\r?\n/).filter(x=>x.trim()).map(line=>line.split('\t'));else rows=parseCSVRows(raw);}const result=importLeadRows(rows);added+=result.added;duplicates+=result.duplicates;invalid+=result.invalid;}catch(err){failed.push(file.name+': '+(err.message||'could not read file'));}}save();render();alert('Import finished.\nImported: '+added+'\nDuplicates skipped: '+duplicates+'\nInvalid or missing emails: '+invalid+(failed.length?'\nFiles not imported:\n'+failed.join('\n'):''));}
function leadDetails(l){const email=String(l.email||'');const parts=email.split('@');const local=(parts[0]||'').split('+')[0].replace(/[._-]+/g,' ').trim();const domain=(parts[1]||'').toLowerCase();const free=['gmail.com','googlemail.com','yahoo.com','outlook.com','hotmail.com','live.com','icloud.com','protonmail.com','aol.com','yandex.com','mail.com'];const generic=/^(info|contact|support|hello|sales|admin|office|team|service|orders?|help|mail|enquiries|enquiry|customerservice|noreply|no.?reply|marketing|billing|accounts|store|shop|webmaster|postmaster|jobs|careers)$/i.test(local);const guess=local.split(/\s+/).filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');const domainName=(domain.split('.')[0]||'').replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());const business=domain&&!free.includes(domain);return {name:String(l.name||'').trim()||(local&&!generic?guess:(business?domainName:'Contact')),company:String(l.company||'').trim()||(business?domainName:'Not identified'),website:String(l.website||'').trim()||(business?'https://'+domain:'')}}function importLeadRows(rows){if(!Array.isArray(rows)||!rows.length)throw Error('The file is empty.');const norm=v=>String(v||'').toLowerCase().trim().replace(/[\s_-]+/g,'');const known=['email','emailaddress','name','firstname','first','fullname','company','brand','brandname','website','url','domain','messagebody','body','message','observation','notes','personalizedmessage'];const first=(rows[0]||[]).map(norm);const hasHeader=first.some(v=>known.includes(v));const headers=hasHeader?first:['email','name','company','website','messageBody'];const data=hasHeader?rows.slice(1):rows;const col=(row,names,fallback)=>{const i=headers.findIndex(h=>names.includes(h));return String((row||[])[i>=0?i:fallback]||'').trim();};let added=0,duplicates=0,invalid=0;for(const row of data){const email=col(row,['email','emailaddress'],0).toLowerCase();if(!email&&!(row||[]).some(v=>v))continue;if(!/^\S+@\S+\.\S+$/.test(email)){invalid++;continue;}if(db.leads.some(x=>String(x.email||'').toLowerCase()===email)){duplicates++;continue;}const local=email.split('@')[0].split('+')[0].replace(/[._-]+/g,' ').trim();const domain=email.split('@')[1].toLowerCase();const domainLabel=domain.split('.')[0];const generic=/^(info|contact|support|hello|sales|admin|office|team|service|orders?|help|mail|enquiries|enquiry|customerservice|noreply|no.?reply|marketing|billing|accounts|store|shop|webmaster|postmaster|jobs|careers)$/i.test(local);const guessedName=local.split(/\s+/).filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');const guessedCompany=domainLabel.replace(/[._-]+/g,' ').split(/\s+/).filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');const name=col(row,['name','firstname','first','fullname'],1)||(!generic?guessedName:'');const company=col(row,['company','brand','brandname'],2)||(!['gmail','googlemail','yahoo','outlook','hotmail','live','icloud','protonmail','aol','yandex','mail'].includes(domainLabel)?guessedCompany:'');let website=col(row,['website','url','domain'],3);if(!website&&company&&domain.includes('.'))website='https://'+domain;const messageBody=col(row,['messagebody','body','message','observation','notes','personalizedmessage'],4);db.leads.push({id:Date.now()+Math.random(),email,name,company,website,messageBody,observation:messageBody,status:'ready',contacted:false});added++;}return{added,duplicates,invalid};}
async function extractWebsiteEmails(){const input=document.getElementById('siteToExtract');const status=document.getElementById('siteExtractStatus');const button=Array.from(document.querySelectorAll('button')).find(b=>b.getAttribute('onclick')==='extractWebsiteEmails()');const url=String(input?.value||'').trim();if(!/^https?:\/\//i.test(url)){alert('Enter a full website URL starting with https:// or http://');return}if(button)button.disabled=true;if(status)status.textContent='Scanning the public page for email addresses…';try{const response=await fetch('/api/extract-site',{method:'POST',headers:{...(await authHeaders()),'content-type':'application/json'},body:JSON.stringify({url})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Website scan failed.');const rows=[['email','name','company','website']];for(const email of result.emails||[])rows.push([email,'','','']);const imported=importLeadRows(rows);save();render();alert('Website scan complete.\nEmails found: '+(result.emails||[]).length+'\nNew contacts: '+imported.added+'\nDuplicates skipped: '+imported.duplicates+(result.note?'\nNote: '+result.note:''));}catch(error){if(status)status.textContent=error.message||'Website scan failed.';else alert(error.message||'Website scan failed.')}finally{if(button)button.disabled=false}}function importCSVText(text){try{const r=importLeadRows(parseCSVRows(String(text||'')));save();render();alert('Import complete.\nImported: '+r.added+'\nDuplicates skipped: '+r.duplicates+'\nInvalid or missing emails: '+r.invalid);}catch(e){alert(e.message||'Could not import this file.');}}async function authHeaders(){const {data:{session}}=await authClient.auth.getSession();return session?{Authorization:'Bearer '+session.access_token}:{}}async function signIn(){if(!authClient)return alert('Sign-in is still loading. Refresh and try again.');const {error}=await authClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin}});if(error)alert('Could not start sign-in: '+error.message)}async function signOut(){if(authClient)await authClient.auth.signOut()}async function unlock(){return signIn()}async function connectGmail(){try{const r=await fetch('/api/auth/google',{headers:await authHeaders()});const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not connect Gmail');window.location.href=data.url}catch(e){alert(e.message||'Could not connect Gmail')}}async function loadGmailAccounts(){let box=document.getElementById('gmailAccounts');try{let r=await fetch('/api/accounts',{headers:await authHeaders()});if(r.status===401){if(box)box.innerHTML='<div class="check">Sign in again to load your Gmail accounts.</div>';return}let a=await r.json();if(!r.ok)throw new Error(a.error||'Could not load accounts');window.gmailAccountsCache=a;if(box)box.innerHTML=a.length?a.map(x=>'<div class="check">'+iconSvg('mail')+' '+esc(x.email)+' · '+(x.enabled?'Connected':'Disabled')+'</div>').join(''):'<div class="empty">No Gmail account connected yet. Select Connect Gmail to begin.</div>';const picker=document.getElementById('sendingAccount');if(picker){const previous=picker.value;picker.innerHTML='<option value="">Choose a connected account</option>'+a.filter(x=>x.enabled!==false).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.email)+'</option>').join('');if(a.some(x=>String(x.id)===String(previous)&&x.enabled!==false))picker.value=previous;else if(a.filter(x=>x.enabled!==false).length===1)picker.value=a.filter(x=>x.enabled!==false)[0].id}if(page==='Dashboard')render()}catch(e){if(box)box.innerHTML='<div class="check">'+esc(e.message||'Could not load accounts')+'</div>';const picker=document.getElementById('sendingAccount');if(picker)picker.innerHTML='<option value="">Could not load Gmail accounts</option>'}}function pickAccount(){let a=db.accounts.filter(x=>x.enabled!==false).sort((a,b)=>(a.used||0)-(b.used||0))[0];return a||null}function modal(x){let m=document.createElement('div');m.className='modal open';m.id='modal';m.innerHTML='<div class="modalbox">'+x+'<button class="btn" onclick="closeModal()">Close</button></div>';document.body.appendChild(m)}function closeModal(){document.getElementById('modal')?.remove()}function normalizeWorkspace(data){const defaults=JSON.parse(JSON.stringify(seed));return {...defaults,...(data||{}),leads:Array.isArray(data?.leads)?data.leads:defaults.leads,subjects:Array.isArray(data?.subjects)?data.subjects:defaults.subjects,messages:Array.isArray(data?.messages)?data.messages:defaults.messages,campaigns:Array.isArray(data?.campaigns)?data.campaigns:defaults.campaigns,accounts:Array.isArray(data?.accounts)?data.accounts:defaults.accounts,settings:{...defaults.settings,...(data?.settings||{})}}}async function syncWorkspace(){if(!authUser||!cloudReady)return;try{const response=await fetch('/api/workspace',{method:'PUT',headers:{...(await authHeaders()),'content-type':'application/json'},body:JSON.stringify({data:db})});if(!response.ok)throw new Error('Cloud save failed');cloudStatus='Synced'}catch{cloudStatus='Sync failed'}}async function loadCloudWorkspace(){try{const response=await fetch('/api/workspace',{headers:await authHeaders()});const result=await response.json();if(!response.ok)throw new Error(result.error||'Could not load cloud data');if(result.data){db=normalizeWorkspace(result.data);localStorage.setItem(KEY,JSON.stringify(db));cloudReady=true;cloudStatus='Synced';render()}else{const legacyKey='bode_outreach_v1';if(!localStorage.getItem(KEY)&&localStorage.getItem(legacyKey)&&confirm('Old local workspace data was found on this browser. Import it into this signed-in account? Choose Cancel if this is a shared device.')){try{db=normalizeWorkspace(JSON.parse(localStorage.getItem(legacyKey)));localStorage.setItem(KEY,JSON.stringify(db))}catch{}}cloudReady=true;cloudStatus='Saving';await syncWorkspace();render()}}catch{cloudReady=false;cloudStatus='Sync unavailable';render()}}async function applyAuthSession(session){const previousId=authUser?.id||null;authSession=session||null;authUser=session?.user||null;if(!authUser){cloudReady=false;cloudStatus='Sign in';renderLogin();return}if(authUser.id!==previousId){KEY='bode_outreach_v1_'+authUser.id;const savedPage=localStorage.getItem(KEY+'_page');restorePage(savedPage);try{db=normalizeWorkspace(JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(seed)))}catch{db=normalizeWorkspace(null)}cloudReady=false;cloudStatus='Loading';app.innerHTML='<div class="auth-wrap"><section class="auth-card"><h1>Loading your workspace</h1><p>Your leads, templates, and campaigns are being synchronized.</p></section></div>';await loadCloudWorkspace()}else{render()}if(['Accounts','Campaigns','Dashboard'].includes(page)||['Accounts','Campaigns'].includes(outreachView))loadGmailAccounts()}function renderLogin(){app.innerHTML='<div class="landing-wrap"><header class="landing-nav"><div class="brand" style="padding:0"><img class="app-mark-img" src="/logo.svg" alt="Outreach OS logo"><div>OUTREACH <span>OS</span></div></div><button class="btn" onclick="openSignIn()">Sign in</button></header><section class="landing-hero"><div><div class="pill" style="display:inline-block;color:var(--green);border-color:#345126">OUTREACH WORKSPACE</div><h1>Turn contact lists into <span>meaningful outreach.</span></h1><p>Find public business contact emails from websites, organize leads, personalize messages without changing your intent, and manage outreach from one clear workspace.</p><div class="landing-actions"><button class="btn primary" onclick="openSignIn()">Open your workspace</button><a class="btn" href="#how-it-works" style="text-decoration:none">See how it works</a></div></div><aside class="landing-feature"><h2>One connected workflow</h2><ul><li>Import a list or enter a website URL</li><li>Organize contact names, companies, and websites</li><li>Personalize messages using your saved rules</li><li>Manage Gmail connection and sending progress</li></ul><p class="muted">Your workspace and connected accounts remain private to your signed-in account.</p></aside></section><section id="how-it-works" class="landing-foot"><strong>How it works</strong><p>Build your lead list. Define your message. Connect Gmail. Track the workflow in one place.</p><a href="/privacy.html" style="color:#9fe66e">Privacy Policy</a> · <a href="/terms.html" style="color:#9fe66e">Terms of Service</a></section><div id="signinModal" class="signin-modal" role="dialog" aria-modal="true" aria-label="Sign in to Outreach OS" onclick="if(event.target===this)closeSignIn()"><section class="auth-card"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div class="brand" style="padding:0"><img class="app-mark-img auth-mark" src="/logo.svg" alt="Outreach OS logo"><div>OUTREACH <span>OS</span></div></div><button class="btn" onclick="closeSignIn()" aria-label="Close sign-in">Close</button></div><h1>Your workspace is ready</h1><p>Sign in with Google to save your contacts and connect Gmail.</p><button class="btn primary" onclick="signIn()">Continue with Google</button><div class="auth-note">Gmail access is requested separately after sign-in.</div></section></div></div>';if(window.signInPromptTimer)clearTimeout(window.signInPromptTimer);window.signInPromptTimer=setTimeout(()=>{if(!authUser)openSignIn()},3000)}function openSignIn(){document.getElementById('signinModal')?.classList.add('open')}function closeSignIn(){document.getElementById('signinModal')?.classList.remove('open')}async function initAuth(){try{const response=await fetch('/api/config');const config=await response.json();if(!response.ok)throw new Error(config.error||'Supabase configuration is missing');if(!window.supabase?.createClient)throw new Error('The sign-in library could not load. Check your connection and refresh.');authClient=window.supabase.createClient(config.supabaseUrl,config.supabaseAnonKey);const {data,error}=await authClient.auth.getSession();if(error)throw error;await applyAuthSession(data.session);authClient.auth.onAuthStateChange((_event,session)=>{applyAuthSession(session)})}catch(error){app.innerHTML='<div class="auth-wrap"><section class="auth-card"><h1>Sign-in setup needed</h1><p>'+esc(error.message||'Could not initialize sign-in')+'</p><p>Check the Supabase browser key in Vercel and the Google provider settings in Supabase Auth.</p><button class="btn" onclick="location.reload()">Try again</button></section></div>'}}if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}let authClient=null,authUser=null,authSession=null;let cloudReady=false,cloudSyncTimer=null,cloudStatus='Sign in';initAuth();
