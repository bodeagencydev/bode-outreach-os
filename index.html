<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b0d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="/manifest.webmanifest"><title>Bode Outreach OS</title><style>
:root{--bg:#090b0d;--panel:#111417;--panel2:#171b1f;--line:#282e33;--text:#f1f4f5;--muted:#8d979e;--green:#6ccb2e;--red:#ff5c5c;--yellow:#f3c74f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:230px;border-right:1px solid var(--line);padding:22px 14px;position:fixed;inset:0 auto 0 0;background:#0b0d0f}.brand{font-weight:800;font-size:18px;padding:8px 10px 26px}.brand span{color:var(--green)}nav button{display:block;width:100%;border:0;background:none;color:#9ca5ab;text-align:left;padding:11px 12px;border-radius:8px;margin:3px 0}nav button.active,nav button:hover{background:#181d20;color:#fff}.main{margin-left:230px;width:calc(100% - 230px);padding:28px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{font-size:24px;margin:0}.pill{padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.stat{font-size:28px;font-weight:800;margin:8px 0}.muted{color:var(--muted)}.section{margin-top:20px}.section h2{font-size:15px;margin:0 0 12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:#fff;padding:9px 13px;border-radius:7px}.btn.primary{background:var(--green);border-color:var(--green);color:#081006;font-weight:800}.btn.danger{color:#ffb0b0;border-color:#6a3030}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}.table th{color:var(--muted);font-size:12px;font-weight:600}.status{font-size:11px;border-radius:999px;padding:4px 7px;border:1px solid var(--line)}.ready{color:#aeea83}.blocked{color:#ff8f8f}.warn{color:#f3c74f}.form{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.input,.textarea,.select{width:100%;background:#0c0f11;color:#fff;border:1px solid var(--line);border-radius:7px;padding:10px}.textarea{min-height:130px;resize:vertical}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px}.tab{background:none;border:0;color:var(--muted);padding:10px}.tab.active{color:#fff;border-bottom:2px solid var(--green)}.risk{border:1px solid var(--line);border-radius:9px;padding:12px}.riskbar{height:7px;background:#262c30;border-radius:99px;overflow:hidden;margin:9px 0}.riskbar i{display:block;height:100%;background:var(--green);width:8%}.checks{display:grid;gap:7px}.check{padding:8px 10px;border-radius:7px;background:#0c0f11}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modalbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(720px,100%);padding:20px;max-height:90vh;overflow:auto}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:850px){.side{width:70px}.brand{font-size:0}.brand span{font-size:18px}.main{margin-left:70px;width:calc(100% - 70px);padding:18px}.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}nav button{font-size:0;text-align:center}nav button:before{content:"•";font-size:18px;color:var(--green)}}@media(max-width:560px){body{padding-bottom:72px}.side{position:fixed;inset:auto 0 0 0;width:100%;height:64px;z-index:50;border-right:0;border-top:1px solid var(--line);padding:5px;background:#0b0d0fee;backdrop-filter:blur(12px)}.brand{display:none}.side nav{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.side nav button{font-size:9px;line-height:1.1;text-align:center;padding:8px 2px;margin:0}.side nav button:before{display:block;font-size:14px;margin-bottom:2px}.side nav button:nth-child(1):before{content:"⌂"}.side nav button:nth-child(2):before{content:"◉"}.side nav button:nth-child(3):before{content:"▣"}.side nav button:nth-child(4):before{content:"≡"}.side nav button:nth-child(5):before{content:"▶"}.side nav button:nth-child(6):before{content:"@"}.side nav button:nth-child(7):before{content:"⚙"}.main{margin-left:0;width:100%;padding:14px}.grid{grid-template-columns:1fr 1fr;gap:8px}.card{padding:14px}.stat{font-size:22px}.toolbar .btn{flex:1;min-height:42px}.input,.textarea,.select,.btn{min-height:42px}.modal{padding:10px}.modalbox{padding:15px;width:100%;border-radius:12px}.row{grid-template-columns:1fr}.table{font-size:12px}}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:22px}.auth-card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px}.auth-card h1{font-size:25px;margin:0 0 8px}.auth-card p{color:var(--muted);line-height:1.6}.auth-card .btn{width:100%;margin-top:12px;min-height:46px}.auth-note{font-size:12px;margin-top:16px;color:var(--muted)}@media(max-width:560px){.auth-wrap{padding:14px}.auth-card{padding:21px}} </style></head><body><div id="root"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
let KEY='bode_outreach_v1';const seed={leads:[],subjects:['Quick idea for {{company}}','Noticed something on {{company}}','A conversion issue I spotted'],messages:[`Hi {{first_name}},\n\nI was looking through {{company}} and noticed {{observation}}\n\nI can show you exactly what I would change if useful.\n\nBode`,`Hi {{first_name}},\n\nI came across {{website}} and noticed {{observation}}\n\nWould you like me to send the short breakdown?\n\nBode`],accounts:[],campaigns:[],settings:{blockRisky:true,requirePersonalization:true,requireReview:true}};let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;function save(){localStorage.setItem(KEY,JSON.stringify(db));if(authUser&&cloudReady){clearTimeout(cloudSyncTimer);cloudSyncTimer=setTimeout(syncWorkspace,650)}}
const app=document.getElementById('root');let page='Dashboard';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function render(){if(!authUser){renderLogin();return}app.innerHTML=`<aside class="side"><div class="brand">BODE <span>OUTREACH</span></div><nav>${['Dashboard','Leads','Campaigns','Templates','Auto Scout','Accounts','Settings'].map(x=>`<button class="${page===x?'active':''}" onclick="go('${x}')">${x}</button>`).join('')}</nav></aside><main class="main">${({Dashboard:dashboard,Leads:leads,Campaigns:campaigns,Templates:templates,'Auto Scout':scout,Accounts:accounts,Settings:settings}[page])()}</main>`}function go(p){page=p;render()}
function header(t,sub=''){return `<div class="top"><div><h1>${t}</h1>${sub?`<div class="muted">${sub}</div>`:''}</div><span class="pill">${esc(authUser?.email||'Signed in')} · ${esc(cloudStatus)}</span></div>`}
function dashboard(){let ready=db.leads.filter(x=>x.status==='ready').length;return header('Dashboard','Simple outreach control center')+`<div class="grid"><div class="card"><div class="muted">Leads</div><div class="stat">${db.leads.length}</div></div><div class="card"><div class="muted">Ready</div><div class="stat">${ready}</div></div><div class="card"><div class="muted">Accounts</div><div class="stat">${db.accounts.length}</div></div><div class="card"><div class="muted">Campaigns</div><div class="stat">${db.campaigns.length}</div></div></div><div class="section card"><h2>Guardrails</h2><div class="checks"><div class="check">✓ Duplicate leads blocked</div><div class="check">✓ Previously contacted leads skipped</div><div class="check">✓ Unsubscribed leads blocked</div><div class="check">✓ Risky promotional patterns flagged</div><div class="check">✓ Personalization can be required before queueing</div></div></div>`}
function leads(){return header('Leads','Import and manage prospects')+`<div class="toolbar"><button class="btn primary" onclick="openLead()">+ Add lead</button><button class="btn" onclick="document.getElementById("csvFile").click()">Import CSV</button><input id="csvFile" type="file" accept=".csv,.txt,text/csv,text/plain" style="display:none" onchange="readCSVFile(this.files[0])"><button class="btn" onclick="clearLeads()">Clear</button></div><div class="section card"><table class="table"><thead><tr><th>Lead</th><th>Website</th><th>Observation</th><th>Status</th><th></th></tr></thead><tbody>${db.leads.map(l=>`<tr><td><b>${esc(l.name||'No name')}</b><br><span class="muted">${esc(l.email)}</span><br>${esc(l.company||'')}</td><td>${esc(l.website||'')}</td><td>${esc(l.observation||'')}</td><td><span class="status ${l.status==='blocked'?'blocked':'ready'}">${esc(l.status)}</span></td><td><button class="btn" onclick="removeLead(${l.id})">Remove</button></td></tr>`).join('')}</tbody></table></div>`}
function campaigns(){return header('Campaigns','Build reusable outreach campaigns')+`<div class="toolbar"><button class="btn primary" onclick="newCampaign()">+ New campaign</button></div><div class="section card">${db.campaigns.length?`<table class="table"><tr><th>Name</th><th>Subjects</th><th>Messages</th><th>Created</th></tr>${db.campaigns.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.subjects}</td><td>${c.messages}</td><td>${c.created}</td></tr>`).join('')}</table>`:'<div class="empty">No campaigns yet.</div>'}</div>`}
function templates(){return header('Templates','Create multiple subject and message variants')+`<div class="section card"><div class="row"><div><label>Subjects, one per line</label><textarea id="subjects" class="textarea">${esc(db.subjects.join('\n'))}</textarea></div><div><label>Message variants, separate with ---</label><textarea id="messages" class="textarea">${esc(db.messages.join('\n---\n'))}</textarea></div></div><button class="btn primary" onclick="saveTemplates()">Save templates</button><div class="section"><div class="muted">Variables: {{first_name}} {{company}} {{website}} {{observation}}</div></div></div>`}
function risk(subject,body,lead){let reasons=[];let text=(subject+' '+body).toLowerCase();if(/free money|guaranteed|act now|urgent|winner|cash|100%|buy now/.test(text))reasons.push('Promotional or urgency language');if((body.match(/https?:\/\//g)||[]).length>2)reasons.push('Too many links');if(/[A-Z]{8,}/.test(subject))reasons.push('Excessive capitalization');if(!lead.observation)reasons.push('Missing lead-specific observation');if((body.match(/!/g)||[]).length>4)reasons.push('Excessive exclamation marks');let score=Math.min(100,reasons.length*20+(lead.observation?0:15));return {score,reasons}}
function scout(){return header('Auto Scout','Queue the next lead without blind clicking')+`<div class="grid"><div class="card"><div class="muted">Queue</div><div class="stat">${db.leads.filter(l=>l.status==='ready'&&!l.contacted).length}</div></div><div class="card"><div class="muted">Accounts</div><div class="stat">${db.accounts.length}</div></div><div class="card"><div class="muted">Risk rule</div><div class="stat">${db.settings.blockRisky?'ON':'OFF'}</div></div><div class="card"><div class="muted">Review</div><div class="stat">${db.settings.requireReview?'ON':'OFF'}</div></div></div><div class="section card"><h2>Auto Scout</h2><p class="muted">Selects the next eligible lead, generates a personalized variant, runs the safety checks, then prepares the email. It does not bypass Gmail sending limits.</p><div class="toolbar"><button class="btn primary" onclick="nextLead()">Start / Next lead</button></div><div id="scoutResult" class="section"></div></div>`}
function accounts(){return header('Accounts','Connect Gmail with Google OAuth')+`<div class="section card"><p class="muted">Gmail accounts connect through Google OAuth. Passwords are never stored. The app can prepare Gmail drafts for review.</p><div class="toolbar"><button class="btn" onclick="signOut()">Sign out</button><button class="btn" onclick="connectGmail()">Connect Gmail</button><button class="btn" onclick="loadGmailAccounts()">Refresh</button></div><div id="gmailAccounts" class="section"><div class="empty">Tap Refresh after unlocking.</div></div></div><div class="section card"><h2>Local queue labels</h2><div class="toolbar"><input id="acct" class="input" placeholder="your@gmail.com"><button class="btn" onclick="addAccount()">Add label</button></div><div class="section"><table class="table"><tr><th>Account</th><th>Activity</th><th></th></tr>${db.accounts.map((a,i)=>`<tr><td>${esc(a.email)}</td><td>${a.used||0}</td><td><button class="btn" onclick="removeAccount(${i})">Remove</button></td></tr>`).join('')}</table></div></div>`}
function settings(){return header('Settings','Safety and workflow controls')+`<div class="card section form"><label><input type="checkbox" ${db.settings.blockRisky?'checked':''} onchange="db.settings.blockRisky=this.checked;save()"> Block high-risk messages</label><label><input type="checkbox" ${db.settings.requirePersonalization?'checked':''} onchange="db.settings.requirePersonalization=this.checked;save()"> Require lead-specific personalization</label><label><input type="checkbox" ${db.settings.requireReview?'checked':''} onchange="db.settings.requireReview=this.checked;save()"> Require human review before opening email</label></div>`}
function openLead(){modal(`<h2>Add lead</h2><div class="form"><input id="lEmail" class="input" placeholder="Email"><input id="lName" class="input" placeholder="First name"><input id="lCompany" class="input" placeholder="Company"><input id="lWebsite" class="input" placeholder="Website"><textarea id="lObs" class="textarea" placeholder="Personal observation"></textarea><button class="btn primary" onclick="addLead()">Save lead</button></div>`)}function addLead(){let email=lEmail.value.trim().toLowerCase();if(!email||!/^\S+@\S+\.\S+$/.test(email))return alert('Enter a valid email.');if(db.leads.some(x=>x.email===email))return alert('Duplicate lead blocked.');db.leads.push({id:Date.now(),email,name:lName.value.trim(),company:lCompany.value.trim(),website:lWebsite.value.trim(),observation:lObs.value.trim(),status:'ready',contacted:false});save();closeModal();render()}
function nextLead(){let l=db.leads.find(x=>(x.status==='ready'||x.status==='prepared')&&!x.contacted);if(!l)return document.getElementById('scoutResult').innerHTML='<div class="empty">No eligible leads.</div>';let si=Math.floor(Math.random()*db.subjects.length),mi=Math.floor(Math.random()*db.messages.length);let sub=db.subjects[si].replaceAll('{{company}}',l.company||'your store');let body=db.messages[mi].replaceAll('{{first_name}}',l.name||'there').replaceAll('{{company}}',l.company||'your store').replaceAll('{{website}}',l.website||'your website').replaceAll('{{observation}}',l.observation||'something worth improving');let r=risk(sub,body,l);let blocked=db.settings.blockRisky&&r.score>=40;document.getElementById('scoutResult').innerHTML=`<div class="risk"><b>Risk score: ${r.score}/100</b><div class="riskbar"><i style="width:${Math.max(5,r.score)}%;background:${r.score>=40?'var(--red)':'var(--green)'}"></i></div>${r.reasons.map(x=>`<div class="check">${blocked?'✕':'⚠'} ${esc(x)}</div>`).join('')}${!r.reasons.length?'<div class="check">✓ No high-risk patterns detected</div>':''}</div><div class="section card"><b>${esc(sub)}</b><pre style="white-space:pre-wrap;font:inherit;color:#cbd2d6">${esc(body)}</pre><div class="toolbar"><button class="btn ${blocked?'danger':'primary'}" ${blocked?'disabled':''} onclick="prepareMail(${l.id},${JSON.stringify(sub)},${JSON.stringify(body)})">${blocked?'Blocked':'Prepare email'}</button><button class="btn" onclick="markContacted(${l.id})">Mark contacted</button></div></div>`}
async function prepareMail(id,sub,body){let l=db.leads.find(x=>x.id===id);if(!l)return;if(db.settings.requirePersonalization&&!l.observation)return alert('Personalization is required. Add an observation first.');try{const accountResponse=await fetch('/api/accounts',{headers:await authHeaders()});if(accountResponse.ok){const connected=await accountResponse.json();if(connected.length){let account=connected[0];if(connected.length>1){const choice=prompt('Choose the Gmail account for this draft:\n'+connected.map((a,i)=>(i+1)+'. '+a.email).join('\n'),'1');if(choice===null)return;const index=Number(choice)-1;if(!Number.isInteger(index)||index<0||index>=connected.length)return alert('Choose a valid account number.');account=connected[index]}const response=await fetch('/api/gmail/draft',{method:'POST',headers:{...(await authHeaders()),'content-type':'application/json'},body:JSON.stringify({account_id:account.id,to:l.email,subject:sub,body})});const result=await response.json();if(!response.ok)return alert(result.error||'Could not create Gmail draft.');l.status='prepared';l.lastPrepared=new Date().toISOString();save();alert('Gmail draft created in '+result.account+'. Review it in Gmail before sending.');render();return}}}catch(error){return alert(error.message||'Could not create Gmail draft.')}l.status='prepared';l.lastPrepared=new Date().toISOString();save();window.location.href='mailto:'+encodeURIComponent(l.email)+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body)}
function markContacted(id){let l=db.leads.find(x=>x.id===id);l.contacted=true;l.status='contacted';save();render()}
function addAccount(){let e=acct.value.trim().toLowerCase();if(!/^\S+@gmail\.com$/.test(e))return alert('Use a Gmail address.');if(db.accounts.some(a=>a.email===e))return;db.accounts.push({email:e,used:0});save();render()}function removeAccount(i){db.accounts.splice(i,1);save();render()}function removeLead(id){db.leads=db.leads.filter(x=>x.id!==id);save();render()}function clearLeads(){if(confirm('Clear all leads?')){db.leads=[];save();render()}}function saveTemplates(){db.subjects=subjects.value.split('\n').map(x=>x.trim()).filter(Boolean);db.messages=messages.value.split('\n---\n').map(x=>x.trim()).filter(Boolean);save();alert('Templates saved.')}
function newCampaign(){let name=prompt('Campaign name');if(!name)return;db.campaigns.push({name,subjects:db.subjects.length,messages:db.messages.length,created:new Date().toLocaleDateString()});save();render()}function readCSVFile(file){if(!file)return;let r=new FileReader();r.onload=()=>importCSVText(r.result);r.readAsText(file)}function importCSV(){let text=prompt('Paste CSV: email,name,company,website,observation');if(!text)return;importCSVText(text)}function importCSVText(text){text.split(/\n+/).slice(1).forEach(row=>{let [email,name,company,website,observation]=row.split(',').map(x=>x.trim());if(email&&/^\S+@\S+\.\S+$/.test(email)&&!db.leads.some(x=>x.email===email))db.leads.push({id:Date.now()+Math.random(),email,name,company,website,observation,status:'ready',contacted:false})});save();render()}
async function authHeaders(){const {data:{session}}=await authClient.auth.getSession();return session?{Authorization:'Bearer '+session.access_token}:{}}async function signIn(){if(!authClient)return alert('Sign-in is still loading. Refresh and try again.');const {error}=await authClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin}});if(error)alert('Could not start sign-in: '+error.message)}async function signOut(){if(authClient)await authClient.auth.signOut()}async function unlock(){return signIn()}async function connectGmail(){try{const r=await fetch('/api/auth/google',{headers:await authHeaders()});const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not connect Gmail');window.location.href=data.url}catch(e){alert(e.message||'Could not connect Gmail')}}async function loadGmailAccounts(){let box=document.getElementById('gmailAccounts');if(!box)return;try{let r=await fetch('/api/accounts',{headers:await authHeaders()});if(r.status===401){box.innerHTML='<div class="check">Sign in again to load your Gmail accounts.</div>';return}let a=await r.json();if(!r.ok)throw new Error(a.error||'Could not load accounts');box.innerHTML=a.length?a.map(x=>'<div class="check">✓ '+esc(x.email)+' · '+(x.enabled?'Eligible':'Disabled')+'</div>').join(''):'<div class="empty">No Gmail account connected yet.</div>'}catch(e){box.innerHTML='<div class="check">'+esc(e.message||'Could not load accounts')+'</div>'}}function pickAccount(){let a=db.accounts.filter(x=>x.enabled!==false).sort((a,b)=>(a.used||0)-(b.used||0))[0];return a||null}function modal(x){let m=document.createElement('div');m.className='modal open';m.id='modal';m.innerHTML='<div class="modalbox">'+x+'<button class="btn" onclick="closeModal()">Close</button></div>';document.body.appendChild(m)}function closeModal(){document.getElementById('modal')?.remove()}function normalizeWorkspace(data){const defaults=JSON.parse(JSON.stringify(seed));return {...defaults,...(data||{}),leads:Array.isArray(data?.leads)?data.leads:defaults.leads,subjects:Array.isArray(data?.subjects)?data.subjects:defaults.subjects,messages:Array.isArray(data?.messages)?data.messages:defaults.messages,campaigns:Array.isArray(data?.campaigns)?data.campaigns:defaults.campaigns,accounts:Array.isArray(data?.accounts)?data.accounts:defaults.accounts,settings:{...defaults.settings,...(data?.settings||{})}}}async function syncWorkspace(){if(!authUser||!cloudReady)return;try{const response=await fetch('/api/workspace',{method:'PUT',headers:{...(await authHeaders()),'content-type':'application/json'},body:JSON.stringify({data:db})});if(!response.ok)throw new Error('Cloud save failed');cloudStatus='Synced'}catch{cloudStatus='Sync failed'}}async function loadCloudWorkspace(){try{const response=await fetch('/api/workspace',{headers:await authHeaders()});const result=await response.json();if(!response.ok)throw new Error(result.error||'Could not load cloud data');if(result.data){db=normalizeWorkspace(result.data);localStorage.setItem(KEY,JSON.stringify(db));cloudReady=true;cloudStatus='Synced';render()}else{const legacyKey='bode_outreach_v1';if(!localStorage.getItem(KEY)&&localStorage.getItem(legacyKey)&&confirm('Old local workspace data was found on this browser. Import it into this signed-in account? Choose Cancel if this is a shared device.')){try{db=normalizeWorkspace(JSON.parse(localStorage.getItem(legacyKey)));localStorage.setItem(KEY,JSON.stringify(db))}catch{}}cloudReady=true;cloudStatus='Saving';await syncWorkspace();render()}}catch{cloudReady=false;cloudStatus='Sync unavailable';render()}}async function applyAuthSession(session){const previousId=authUser?.id||null;authSession=session||null;authUser=session?.user||null;if(!authUser){cloudReady=false;cloudStatus='Sign in';renderLogin();return}if(authUser.id!==previousId){KEY='bode_outreach_v1_'+authUser.id;try{db=normalizeWorkspace(JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(seed)))}catch{db=normalizeWorkspace(null)}cloudReady=false;cloudStatus='Loading';app.innerHTML='<div class="auth-wrap"><section class="auth-card"><h1>Loading your workspace</h1><p>Your leads, templates, and campaigns are being synchronized.</p></section></div>';await loadCloudWorkspace()}else{render()}if(page==='Accounts')loadGmailAccounts()}function renderLogin(){app.innerHTML='<div class="auth-wrap"><section class="auth-card"><div class="brand" style="padding:0 0 18px">BODE <span>OUTREACH</span></div><h1>Your outreach workspace</h1><p>Sign in with Google to access your own workspace and connect your Gmail account. Your connected Gmail accounts are kept separate from other users.</p><button class="btn primary" onclick="signIn()">Continue with Google</button><div class="auth-note">Gmail access is requested separately after sign-in. You can review email drafts before sending.</div></section></div>'}async function initAuth(){try{const response=await fetch('/api/config');const config=await response.json();if(!response.ok)throw new Error(config.error||'Supabase configuration is missing');if(!window.supabase?.createClient)throw new Error('The sign-in library could not load. Check your connection and refresh.');authClient=window.supabase.createClient(config.supabaseUrl,config.supabaseAnonKey);const {data,error}=await authClient.auth.getSession();if(error)throw error;await applyAuthSession(data.session);authClient.auth.onAuthStateChange((_event,session)=>{applyAuthSession(session)})}catch(error){app.innerHTML='<div class="auth-wrap"><section class="auth-card"><h1>Sign-in setup needed</h1><p>'+esc(error.message||'Could not initialize sign-in')+'</p><p>Check the Supabase browser key in Vercel and the Google provider settings in Supabase Auth.</p><button class="btn" onclick="location.reload()">Try again</button></section></div>'}}if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}let authClient=null,authUser=null,authSession=null;let cloudReady=false,cloudSyncTimer=null,cloudStatus='Sign in';initAuth();
</script></body></html>
